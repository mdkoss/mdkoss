<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 平台步进示教</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2e;
      --text: #dce7ff;
      --muted: #90a4d4;
      --ok: #35d08f;
      --warn: #ffcc66;
      --danger: #ff5d5d;
      --line: #1f2c4a;
      --accent: #4e8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #16264a 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 20px; }
    .header {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;
      flex-wrap: wrap; gap: 8px 16px;
    }
    .title { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 13px; }
    .layout {
      display: grid;
      grid-template-columns: 360px 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 1024px) {
      .layout { grid-template-columns: 1fr; }
    }
    .card {
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 16px;
      backdrop-filter: blur(4px);
    }
    .panel-title {
      font-size: 15px;
      font-weight: 700;
      margin: 0 0 12px 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .panel-title span.hint { font-size: 12px; font-weight: 500; color: var(--muted); }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
    }
    .status-badge.closed { background: rgba(144,164,212,.15); color: var(--muted); border: 1px solid var(--line); }
    .status-badge.open { background: rgba(53,208,143,.15); color: var(--ok); border: 1px solid rgba(53,208,143,.35); }
    .status-badge.error { background: rgba(255,93,93,.15); color: var(--danger); border: 1px solid rgba(255,93,93,.35); }
    .dot {
      width: 8px; height: 8px; border-radius: 50%; display: inline-block;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 8px rgba(53,208,143,.8); }
    .dot.err { background: var(--danger); box-shadow: 0 0 8px rgba(255,93,93,.8); }

    .form-group { margin-bottom: 12px; }
    .form-group label { display: block; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
    .form-row { display: flex; gap: 8px; }
    .form-row .form-group { flex: 1; }

    input, select, textarea {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #0a1120;
      color: var(--text);
      font-size: 13px;
      font-family: inherit;
    }
    input:focus, select:focus, textarea:focus {
      outline: none;
      border-color: var(--accent);
    }
    input:disabled, select:disabled, textarea:disabled {
      opacity: .5;
      cursor: not-allowed;
    }
    textarea {
      min-height: 120px;
      resize: vertical;
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      line-height: 1.4;
    }

    .btn {
      padding: 8px 16px;
      border-radius: 6px;
      border: 1px solid var(--line);
      background: #162644;
      color: var(--text);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all .15s ease;
    }
    .btn:hover:not(:disabled) { background: #1f3044; border-color: var(--accent); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    .btn.primary { background: rgba(78,140,255,.2); border-color: rgba(78,140,255,.4); color: var(--accent); }
    .btn.primary:hover:not(:disabled) { background: rgba(78,140,255,.3); }
    .btn.danger { background: rgba(255,93,93,.15); border-color: rgba(255,93,93,.35); color: var(--danger); }
    .btn.danger:hover:not(:disabled) { background: rgba(255,93,93,.25); }
    .btn-group { display: flex; gap: 8px; flex-wrap: wrap; }
    .btn-group .btn { flex: 1; min-width: 80px; }

    .checkbox-label {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      cursor: pointer;
    }
    .checkbox-label input[type="checkbox"] {
      width: auto;
      margin: 0;
    }

    .hex-mode { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .radio-group { display: flex; gap: 12px; font-size: 12px; }
    .radio-label { display: flex; align-items: center; gap: 4px; cursor: pointer; }
    .radio-label input { width: auto; margin: 0; }

    .rx-area { position: relative; }
    .rx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .rx-header h3 { margin: 0; font-size: 14px; font-weight: 600; }
    .rx-stats { font-size: 12px; color: var(--muted); }
    .rx-textarea {
      min-height: 200px;
      background: #080d18;
      border-color: var(--line);
    }
    .rx-textarea.empty { color: var(--muted); font-style: italic; }

    .tx-area { margin-top: 16px; }
    .tx-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }
    .tx-header h3 { margin: 0; font-size: 14px; font-weight: 600; }

    .msg { font-size: 12px; margin-top: 8px; min-height: 1.2em; }
    .msg.ok { color: var(--ok); }
    .msg.err { color: var(--danger); }
    .msg.info { color: var(--muted); }

    .info-row {
      display: flex;
      justify-content: space-between;
      font-size: 12px;
      padding: 6px 0;
      border-bottom: 1px solid var(--line);
    }
    .info-row:last-child { border-bottom: none; }
    .info-label { color: var(--muted); }
    .info-value { font-family: ui-monospace, Consolas, monospace; }

    .footer { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .footer code { color: #a8c4ff; }
  
    .main-layout { display: grid; grid-template-columns: minmax(280px, 38%) 1fr; gap: 16px; }
    @media (max-width: 1024px) { .main-layout { grid-template-columns: 1fr; } }
    .jog-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .jog-btn { min-height: 44px; border-radius: 8px; border: 1px solid var(--line); background: #162644; color: var(--text); font-weight: 700; cursor: pointer; }
    .jog-btn:disabled { opacity: .35; }
    .jog-btn .arr { color: var(--warn); margin-right: 4px; }
    .pos-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
    .pos-field.na input { color: var(--muted); font-style: italic; }
    .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
    .tab { padding: 8px 14px; border: none; background: transparent; color: var(--muted); cursor: pointer; border-bottom: 2px solid transparent; margin-bottom: -1px; }
    .tab.active { color: var(--accent); border-bottom-color: var(--accent); }
    .tab-panel { display: none; } .tab-panel.active { display: block; }
    .toast { position: fixed; top: 16px; right: 16px; z-index: 100; transform: translateX(120%); transition: transform .25s; padding: 12px; background: #1a2844; border: 1px solid var(--line); border-radius: 8px; }
    .toast.show { transform: translateX(0); } .toast.err { color: #ffb4b4; } .toast.ok { color: #9ef0c8; }
    .warn-bar { padding: 10px; border-radius: 8px; margin-bottom: 12px; background: rgba(255,204,102,.08); border: 1px solid rgba(255,204,102,.3); color: var(--warn); }
    .warn-bar.hidden { display: none; }
    .meta-row { display: flex; gap: 16px; flex-wrap: wrap; font-size: 13px; }
    .nav a { color: var(--accent); text-decoration: none; font-size: 13px; padding: 6px 10px; border: 1px solid var(--line); border-radius: 6px; margin-left: 6px; }
  </style>
</head>
<body>
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">平台步进示教</div>
        <div class="sub" id="hdrSubtitle">请选择平台设备</div>
      </div>
      <nav class="nav">
        <a href="/">监控首页</a>
        <a href="/monitorIO.html">IO 监控</a>
        <a href="/debugSerialDev.html">串口调试</a>
      </nav>
    </div>
    <div id="warnBar" class="warn-bar hidden">运行时未启动，仍可调试平台。</div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>平台设备</label>
        <select id="selPlatform"><option value="">— 选择平台 —</option></select>
      </div>
      <div class="form-group">
        <label>项目</label>
        <div id="badgeProject" style="padding:8px 0">—</div>
      </div>
      <div class="form-group">
        <label>运行</label>
        <div id="badgeRuntime">—</div>
      </div>
    </div>
    <div class="sub" style="margin-bottom:12px">刷新: <span id="pollHint">1s</span></div>
    <div class="main-layout">
      <div class="card">
        <h2 class="panel-title">步进</h2>
        <div class="form-row">
          <div class="form-group"><label>模式</label><select id="selMode"><option value="default">默认</option><option value="joint">关节</option><option value="world">世界</option></select></div>
          <div class="form-group"><label>速度</label><select id="selSpeed"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>
        </div>
        <div id="jogGrid" class="jog-grid"></div>
        <div class="btn-group">
          <button type="button" class="btn primary" id="btnEnable">平台使能</button>
          <button type="button" class="btn danger" id="btnDisable">平台去使能</button>
        </div>
      </div>
      <div class="card">
        <h2 class="panel-title">目前位置</h2>
        <div class="radio-row">
          <label><input type="radio" name="coord" value="world" /> 世界 (W)</label>
          <label><input type="radio" name="coord" value="joint" checked /> 关节 (J)</label>
          <label><input type="radio" name="coord" value="pulse" /> 脉冲 (U)</label>
        </div>
        <div class="pos-grid">
          <div class="pos-field" id="posField_X">
            <label>X <span id="unit_X">mm</span></label>
            <input type="text" id="pos_X" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_Y">
            <label>Y <span id="unit_Y">mm</span></label>
            <input type="text" id="pos_Y" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_Z">
            <label>Z <span id="unit_Z">mm</span></label>
            <input type="text" id="pos_Z" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_U">
            <label>U <span id="unit_U">mm</span></label>
            <input type="text" id="pos_U" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_V">
            <label>V <span id="unit_V">mm</span></label>
            <input type="text" id="pos_V" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_W">
            <label>W <span id="unit_W">mm</span></label>
            <input type="text" id="pos_W" readonly value="—" />
          </div>
        </div>
        <h2 class="panel-title">平台与轴状态</h2>
        <div class="meta-row">
          <div><span>类型 </span><strong id="metaKind">—</strong></div>
          <div><span>使能 </span><span id="metaMotion">—</span></div>
          <div><span>状态 </span><strong id="metaState">—</strong></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>轴</th><th>子设备</th><th>驱动</th><th>在线</th><th>使能</th><th>备注</th></tr></thead><tbody id="axisTableBody"></tbody></table></div>
        <h2 class="panel-title">步进距离</h2>
        <div class="radio-row">
          <label><input type="radio" name="stepPreset" value="continuous" checked /> 连续 (C)</label>
          <label><input type="radio" name="stepPreset" value="long" /> 长 (L)</label>
          <label><input type="radio" name="stepPreset" value="medium" /> 中 (M)</label>
          <label><input type="radio" name="stepPreset" value="short" /> 短 (S)</label>
        </div>
        <div class="form-row">
          <div class="form-group"><label>X 步距</label><input type="number" id="step_X" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>Y 步距</label><input type="number" id="step_Y" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>Z 步距</label><input type="number" id="step_Z" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>U 步距</label><input type="number" id="step_U" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>V 步距</label><input type="number" id="step_V" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>W 步距</label><input type="number" id="step_W" step="0.001" value="1" disabled /></div>
        </div>
      </div>
    </div>
    <div class="card bottom-card">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="teach">示教点</button>
        <button type="button" class="tab" data-tab="action">执行动作</button>
        <button type="button" class="tab" data-tab="io">关联 IO</button>
      </div>
      <div id="panel-teach" class="tab-panel active">
        <div class="form-row">
          <div class="form-group"><label>点文件</label><select id="selTeachFile"><option value="default">default.pts.json</option></select></div>
          <div class="form-group"><label>点</label><select id="selPoint"></select></div>
        </div>
        <div class="btn-group">
          <button type="button" class="btn primary" id="btnTeach">示教 (T)</button>
          <button type="button" class="btn" id="btnGoto">定位</button>
          <button type="button" class="btn" id="btnAddPoint">新增点</button>
          <button type="button" class="btn" id="btnExport">导出</button>
          <label class="btn">导入<input type="file" id="importFile" accept=".json" hidden /></label>
        </div>
      </div>
      <div id="panel-action" class="tab-panel">
        <div class="form-row">
          <div class="form-group"><label>设备 ID</label><input type="text" id="customDevice" placeholder="platformId 或 axisId" /></div>
          <div class="form-group"><label>action</label><input type="text" id="customAction" placeholder="enable / move" /></div>
        </div>
        <div class="form-group"><label>parameters (JSON)</label><textarea id="customParams" rows="2">{}</textarea></div>
        <button type="button" class="btn primary" id="btnCustomAction">执行</button>
        <div class="log-box" id="actionLog"></div>
      </div>
      <div id="panel-io" class="tab-panel">
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>名称</th><th>类型</th><th>状态</th><th>链接</th></tr></thead><tbody id="ioTableBody"></tbody></table></div>
      </div>
    </div>
    <p class="footer">API: <code>/api/status</code> · <code>/api/devices/{id}/action</code></p>
  </div>
<script src="monitorPlatform.js"></script>
</body>
</html>
