<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS IO 监控</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2e;
      --text: #dce7ff;
      --muted: #90a4d4;
      --ok: #35d08f;
      --warn: #ffcc66;
      --danger: #ff5d5d;
      --line: #1f2c4a;
      --accent: #4e8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #16264a 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1480px; margin: 0 auto; padding: 20px; }
    .header {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;
      flex-wrap: wrap; gap: 8px 16px;
    }
    .title { font-size: 24px; font-weight: 700; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 13px; }
    .io-layout {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      align-items: start;
    }
    @media (max-width: 960px) {
      .io-layout { grid-template-columns: 1fr; }
    }
    .card {
      min-width: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(4px);
    }
    .panel-title {
      font-size: 16px;
      font-weight: 700;
      margin: 0 0 10px 0;
      color: var(--text);
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }
    .panel-title span.hint { font-size: 12px; font-weight: 500; color: var(--muted); }
    .filter {
      width: 100%;
      margin-bottom: 10px;
      padding: 9px 12px;
      border-radius: 8px;
      border: 1px solid var(--line);
      background: #0a1120;
      color: var(--text);
      font-size: 13px;
    }
    .filter::placeholder { color: var(--muted); opacity: .8; }
    .table-scroll {
      max-height: min(62vh, 640px);
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0a1120;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; vertical-align: middle; }
    th {
      position: sticky; top: 0; z-index: 1;
      background: #121c30; color: var(--muted); font-weight: 600;
    }
    tbody tr:hover td { background: rgba(78, 140, 255, 0.06); }
    tbody tr.hidden { display: none; }
    .mono { font-family: ui-monospace, Consolas, monospace; font-size: 12px; }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 10px rgba(53,208,143,.8); }
    .pill-on {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(53,208,143,.15);
      color: var(--ok);
      border: 1px solid rgba(53,208,143,.35);
    }
    .pill-off {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      background: rgba(144,164,212,.12);
      color: var(--muted);
      border: 1px solid var(--line);
    }
    .pill-unk { color: var(--muted); font-size: 12px; }
    .toggle-wrap { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .toggle {
      position: relative;
      width: 48px;
      height: 26px;
      border-radius: 999px;
      border: 1px solid var(--line);
      background: #162644;
      cursor: pointer;
      padding: 0;
      flex-shrink: 0;
      transition: background .15s ease, border-color .15s ease;
    }
    .toggle:disabled {
      opacity: .45;
      cursor: not-allowed;
    }
    .toggle::after {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--muted);
      transition: transform .15s ease, background .15s ease;
    }
    .toggle.on {
      background: rgba(53,208,143,.25);
      border-color: rgba(53,208,143,.45);
    }
    .toggle.on::after {
      transform: translateX(22px);
      background: var(--ok);
    }
    .toggle:not(.on)::after { transform: translateX(0); }
    .msg { font-size: 12px; color: var(--muted); margin-top: 8px; min-height: 1.2em; }
    .msg.err { color: #ff8a8a; }
    .footer { margin-top: 14px; color: var(--muted); font-size: 12px; }
    .footer code { color: #a8c4ff; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div class="title">IO 监控（DI / DO）</div>
      <div class="sub">数据：<code>/api/status</code> · 刷新 1s · DO 写入：<code>POST /api/io/write</code></div>
    </div>

    <div class="io-layout">
      <div class="card">
        <h2 class="panel-title">数字输入 <span class="hint">DI</span></h2>
        <input type="search" class="filter" id="diFilter" placeholder="筛选：设备 ID、别名、驱动、地址、状态…" autocomplete="off" />
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>设备 ID</th>
                <th>别名</th>
                <th>驱动 ID</th>
                <th>地址</th>
                <th>驱动在线</th>
                <th>读值</th>
              </tr>
            </thead>
            <tbody id="diRows"></tbody>
          </table>
        </div>
      </div>

      <div class="card">
        <h2 class="panel-title">数字输出 <span class="hint">DO · 点击拨动开关写入</span></h2>
        <input type="search" class="filter" id="doFilter" placeholder="筛选：设备 ID、别名、驱动、地址、状态…" autocomplete="off" />
        <div class="table-scroll">
          <table>
            <thead>
              <tr>
                <th>设备 ID</th>
                <th>别名</th>
                <th>驱动 ID</th>
                <th>地址</th>
                <th>驱动在线</th>
                <th>读值</th>
                <th>输出</th>
              </tr>
            </thead>
            <tbody id="doRows"></tbody>
          </table>
        </div>
      </div>
    </div>

    <div class="msg" id="ioMsg"></div>
    <div class="footer">上次刷新：<span id="lastUpdate">-</span></div>
  </div>

  <script>
    function snapshotField(data, camel, pascal) {
      const a = data[camel];
      if (a !== undefined && a !== null) return a;
      return data[pascal];
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normDir(d) {
      return String(d || "").trim().toLowerCase();
    }

    function parseBoolVal(valStr) {
      if (valStr === null || valStr === undefined) return null;
      const t = String(valStr).trim().toLowerCase();
      if (t === "true" || t === "1" || t === "on" || t === "yes") return true;
      if (t === "false" || t === "0" || t === "off" || t === "no") return false;
      return null;
    }

    function collectPoints(devices) {
      const flat = [];
      const obj = devices && typeof devices === "object" ? devices : {};
      for (const [devId, d] of Object.entries(obj)) {
        const pts = d.gpioIoPoints ?? d.GpioIoPoints;
        if (!Array.isArray(pts) || !pts.length) continue;
        for (const p of pts) {
          const alias = p.alias ?? p.Alias ?? "-";
          const dir = normDir(p.direction ?? p.Direction ?? "-");
          const drv = p.driverId ?? p.DriverId ?? "-";
          const addr = p.address ?? p.Address ?? "-";
          const online = !!(p.driverOnline ?? p.DriverOnline);
          const val = p.value ?? p.Value;
          const valStr = val === null || val === undefined ? "—" : String(val);
          flat.push({ devId, alias, dir, drv, addr, online, valStr });
        }
      }
      return flat;
    }

    const diRows = document.getElementById("diRows");
    const doRows = document.getElementById("doRows");
    const diFilter = document.getElementById("diFilter");
    const doFilter = document.getElementById("doFilter");
    const lastUpdate = document.getElementById("lastUpdate");
    const ioMsg = document.getElementById("ioMsg");

    let lastDi = [];
    let lastDo = [];

    function rowKey(r) {
      return r.devId + "\0" + r.alias;
    }

    function rowMatches(r, q) {
      if (!q) return true;
      const hay = [r.devId, r.alias, r.drv, r.addr, r.valStr, r.online ? "在线" : "离线", r.dir]
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    }

    function applyDiFilter() {
      const q = diFilter.value.trim().toLowerCase();
      const trs = diRows.querySelectorAll("tr[data-key]");
      trs.forEach((tr) => {
        const key = tr.getAttribute("data-key");
        const r = lastDi.find((x) => rowKey(x) === key);
        if (!r) return;
        tr.classList.toggle("hidden", !rowMatches(r, q));
      });
    }

    function applyDoFilter() {
      const q = doFilter.value.trim().toLowerCase();
      const trs = doRows.querySelectorAll("tr[data-key]");
      trs.forEach((tr) => {
        const key = tr.getAttribute("data-key");
        const r = lastDo.find((x) => rowKey(x) === key);
        if (!r) return;
        tr.classList.toggle("hidden", !rowMatches(r, q));
      });
    }

    function statusCell(online) {
      return `<td><span class="dot ${online ? "ok" : ""}"></span>${online ? "Yes" : "No"}</td>`;
    }

    function valueCell(valStr) {
      const b = parseBoolVal(valStr);
      if (b === true) {
        return `<td class="mono"><span class="pill-on">ON</span> <span style="color:var(--muted)">${escapeHtml(valStr)}</span></td>`;
      }
      if (b === false) {
        return `<td class="mono"><span class="pill-off">OFF</span> <span style="color:var(--muted)">${escapeHtml(valStr)}</span></td>`;
      }
      return `<td class="mono"><span class="pill-unk">${escapeHtml(valStr)}</span></td>`;
    }

    function renderDi(list) {
      lastDi = list;
      if (!list.length) {
        diRows.innerHTML = '<tr><td colspan="6" style="color:#90a4d4">（无 DI 映射或暂无数据）</td></tr>';
        return;
      }
      diRows.innerHTML = list
        .map(
          (r) => `<tr data-key="${escapeHtml(rowKey(r))}">
          <td class="mono">${escapeHtml(r.devId)}</td>
          <td>${escapeHtml(r.alias)}</td>
          <td class="mono">${escapeHtml(r.drv)}</td>
          <td class="mono">${escapeHtml(r.addr)}</td>
          ${statusCell(r.online)}
          ${valueCell(r.valStr)}
        </tr>`
        )
        .join("");
      applyDiFilter();
    }

    function renderDo(list) {
      lastDo = list;
      if (!list.length) {
        doRows.innerHTML = '<tr><td colspan="7" style="color:#90a4d4">（无 DO 映射或暂无数据）</td></tr>';
        return;
      }
      doRows.innerHTML = list
        .map((r) => {
          const b = parseBoolVal(r.valStr);
          const onClass = b === true ? " on" : "";
          const disabled = r.online ? "" : " disabled";
          return `<tr data-key="${escapeHtml(rowKey(r))}">
          <td class="mono">${escapeHtml(r.devId)}</td>
          <td>${escapeHtml(r.alias)}</td>
          <td class="mono">${escapeHtml(r.drv)}</td>
          <td class="mono">${escapeHtml(r.addr)}</td>
          ${statusCell(r.online)}
          ${valueCell(r.valStr)}
          <td>
            <div class="toggle-wrap">
              <button type="button" class="toggle${onClass}"${disabled}
                title="${r.online ? "切换输出电平" : "驱动离线，无法写入"}"
                data-dev="${escapeHtml(r.devId)}"
                data-alias="${escapeHtml(r.alias)}"
                aria-label="切换 DO ${escapeHtml(r.alias)}"></button>
            </div>
          </td>
        </tr>`;
        })
        .join("");

      doRows.querySelectorAll("button.toggle").forEach((btn) => {
        btn.addEventListener("click", onToggleClick);
      });
      applyDoFilter();
    }

    async function onToggleClick(ev) {
      const btn = ev.currentTarget;
      if (btn.disabled) return;
      const devId = btn.getAttribute("data-dev");
      const alias = btn.getAttribute("data-alias");
      const r = lastDo.find((x) => x.devId === devId && x.alias === alias);
      const cur = r ? parseBoolVal(r.valStr) : null;
      const next = cur === true ? false : true;
      ioMsg.textContent = "正在写入…";
      ioMsg.classList.remove("err");
      try {
        const res = await fetch("/api/io/write", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ deviceId: devId, alias: alias, value: next }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) {
          throw new Error(data.error || "http " + res.status);
        }
        ioMsg.textContent = "写入成功";
        await tick();
      } catch (e) {
        ioMsg.textContent = "写入失败: " + (e && e.message ? e.message : String(e));
        ioMsg.classList.add("err");
      }
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("http " + res.status);
        const data = await res.json();
        const devicesObj = snapshotField(data, "devices", "Devices");
        const all = collectPoints(devicesObj);
        const di = all.filter((r) => r.dir === "in");
        const dout = all.filter((r) => r.dir === "out");
        renderDi(di);
        renderDo(dout);
        lastUpdate.textContent = new Date().toLocaleTimeString();
      } catch (err) {
        diRows.innerHTML = '<tr><td colspan="6" style="color:#90a4d4">无法加载</td></tr>';
        doRows.innerHTML = '<tr><td colspan="7" style="color:#90a4d4">无法加载</td></tr>';
        ioMsg.textContent = "无法连接 /api/status";
        ioMsg.classList.add("err");
      }
    }

    diFilter.addEventListener("input", applyDiFilter);
    doFilter.addEventListener("input", applyDoFilter);

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
