<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 监控面板</title>
  <style>
    :root {
      --bg: #0b1220;
      --panel: #101a2e;
      --text: #dce7ff;
      --muted: #90a4d4;
      --ok: #35d08f;
      --warn: #ffcc66;
      --line: #1f2c4a;
      --accent: #4e8cff;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: radial-gradient(circle at top right, #16264a 0%, var(--bg) 40%);
      color: var(--text);
      min-height: 100vh;
    }
    .wrap { max-width: 1100px; margin: 0 auto; padding: 20px; }
    .header {
      display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 16px;
      flex-wrap: wrap; gap: 8px 16px;
    }
    .title { font-size: 26px; font-weight: 700; letter-spacing: .5px; }
    .sub { color: var(--muted); font-size: 13px; }
    .grid {
      display: grid; gap: 12px; grid-template-columns: repeat(12, 1fr);
      grid-auto-rows: minmax(0, auto);
    }
    .card {
      min-width: 0;
      background: linear-gradient(180deg, rgba(255,255,255,.03), rgba(255,255,255,0));
      border: 1px solid var(--line);
      border-radius: 12px;
      padding: 14px;
      backdrop-filter: blur(4px);
    }
    .span-4 { grid-column: span 4; }
    .span-8 { grid-column: span 8; }
    .span-12 { grid-column: span 12; }
    .label { color: var(--muted); font-size: 12px; margin-bottom: 6px; }
    .value { font-size: 24px; font-weight: 700; line-height: 1.25; word-break: break-word; }
    .pill {
      display: inline-block; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 600;
      border: 1px solid var(--line); color: var(--muted);
    }
    .pill.ok { color: var(--ok); border-color: rgba(53,208,143,.4); background: rgba(53,208,143,.1); }
    .pill.warn { color: var(--warn); border-color: rgba(255,204,102,.4); background: rgba(255,204,102,.1); }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th, td { padding: 8px 10px; border-bottom: 1px solid var(--line); text-align: left; }
    th { color: var(--muted); font-weight: 600; }
    pre {
      margin: 0; background: #0a1120; border: 1px solid var(--line); border-radius: 10px; padding: 12px;
      max-height: 340px; overflow: auto; color: #c8d7ff;
    }
    .vars-wrap {
      max-height: 420px; overflow: auto; border: 1px solid var(--line); border-radius: 10px;
      background: #0a1120;
    }
    .vars-table { width: 100%; border-collapse: collapse; font-size: 13px; }
    .vars-table th {
      position: sticky; top: 0; z-index: 1;
      background: #121c30; color: var(--muted); font-weight: 600; text-align: left;
      padding: 10px 12px; border-bottom: 1px solid var(--line);
    }
    .vars-table td { padding: 8px 12px; border-bottom: 1px solid var(--line); vertical-align: top; }
    .vars-table td.var-key {
      width: 38%; max-width: 0; color: #a8c4ff; font-family: ui-monospace, Consolas, monospace;
      word-break: break-all; white-space: normal;
    }
    .vars-table td.var-value {
      color: #c8d7ff; word-break: break-word; white-space: pre-wrap;
      font-family: ui-monospace, Consolas, monospace; font-size: 12px;
    }
    .vars-table tbody tr:hover td { background: rgba(78, 140, 255, 0.06); }
    .dot {
      width: 9px; height: 9px; border-radius: 50%; display: inline-block; margin-right: 8px; vertical-align: middle;
      background: var(--warn);
    }
    .dot.ok { background: var(--ok); box-shadow: 0 0 10px rgba(53,208,143,.8); }
    .footer { margin-top: 10px; color: var(--muted); font-size: 12px; }
    .nav { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
    .nav a {
      color: var(--accent); text-decoration: none; font-size: 13px;
      padding: 6px 10px; border: 1px solid var(--line); border-radius: 8px;
    }
    .nav a:hover { background: rgba(78, 140, 255, 0.1); }
    .op-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
    .link-btn {
      color: var(--accent); text-decoration: none; font-size: 12px; font-weight: 600;
    }
    .link-btn:hover { text-decoration: underline; }
    .btn {
      border: 1px solid var(--line);
      background: #162644;
      color: var(--text);
      border-radius: 8px;
      padding: 8px 12px;
      cursor: pointer;
      font-size: 13px;
    }
    .btn:hover { background: #1d3157; }
    .btn.green { border-color: rgba(53,208,143,.4); }
    .btn.yellow { border-color: rgba(255,204,102,.4); }
    .btn.red { border-color: rgba(255,93,93,.4); }
    .io-wrap {
      max-height: 380px;
      overflow: auto;
      border: 1px solid var(--line);
      border-radius: 10px;
      background: #0a1120;
    }
    @media (max-width: 900px) { .span-4, .span-8 { grid-column: span 12; } }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">MDKOSS Runtime Monitor</div>
        <nav class="nav">
          <a href="/monitorPlatform.html">平台步进示教</a>
          <a href="/monitorIO.html">IO 监控</a>
          <a href="/debugSerialDev.html">串口调试</a>
        </nav>
      </div>
      <div class="sub">自动刷新间隔：1s</div>
    </div>
    <div class="grid">
      <div class="card span-4">
        <div class="label">项目</div>
        <div class="value" id="projectName">-</div>
      </div>
      <div class="card span-4">
        <div class="label">运行状态</div>
        <div id="runtimeStatus"><span class="pill warn">UNKNOWN</span></div>
      </div>
      <div class="card span-4">
        <div class="label">在线驱动数</div>
        <div class="value" id="driverOnlineCount">0</div>
      </div>

      <div class="card span-8">
        <div class="label">驱动状态</div>
        <table>
          <thead><tr><th>Driver ID</th><th>Type</th><th>Status</th></tr></thead>
          <tbody id="driverRows"></tbody>
        </table>
      </div>

      <div class="card span-12">
        <div class="label">设备状态</div>
        <table>
          <thead>
            <tr>
              <th>Device ID</th>
              <th>名称</th>
              <th>类型</th>
              <th>状态</th>
              <th>驱动/链路</th>
              <th>在线</th>
              <th>调试</th>
            </tr>
          </thead>
          <tbody id="deviceRows"></tbody>
        </table>
      </div>

      <div class="card span-12">
        <div class="label">GPIO IO 状态（来自各设备的 gpioIoPoints）</div>
        <div class="io-wrap">
          <table>
            <thead>
              <tr>
                <th>设备 ID</th>
                <th>别名</th>
                <th>方向</th>
                <th>驱动 ID</th>
                <th>地址</th>
                <th>驱动在线</th>
                <th>读值</th>
              </tr>
            </thead>
            <tbody id="gpioIoRows"></tbody>
          </table>
        </div>
      </div>

      <div class="card span-4">
        <div class="label">最后更新时间</div>
        <div class="value" id="lastUpdate" style="font-size: 18px">-</div>
      </div>

      <div class="card span-12">
        <div class="label">任务操作</div>
        <div class="op-row">
          <button class="btn green" onclick="sendTaskAction('/api/task/start')">启动任务</button>
          <button class="btn red" onclick="sendTaskAction('/api/task/stop')">停止任务</button>
          <button class="btn yellow" onclick="sendTaskAction('/api/task/reset')">复位任务</button>
        </div>
        <div class="op-row">
          <button class="btn red" onclick="sendTaskAction('/api/task/lamp?color=red')">红灯</button>
          <button class="btn yellow" onclick="sendTaskAction('/api/task/lamp?color=yellow')">黄灯</button>
          <button class="btn green" onclick="sendTaskAction('/api/task/lamp?color=green')">绿灯</button>
        </div>
        <div class="footer" id="taskOperationState">状态: -</div>
      </div>

      <div class="card span-12">
        <div class="label">运行变量</div>
        <div class="vars-wrap">
          <table class="vars-table">
            <thead><tr><th>键</th><th>值</th></tr></thead>
            <tbody id="varsRows"></tbody>
          </table>
        </div>
      </div>
    </div>
    <div class="footer">接口: <code>/api/status</code> · 平台调试: <a class="link-btn" href="/monitorPlatform.html">monitorPlatform.html</a></div>
  </div>

  <script>
    /** Reads camelCase or PascalCase snapshot fields (matches System.Text.Json naming). */
    function snapshotField(data, camel, pascal) {
      const a = data[camel];
      if (a !== undefined && a !== null) {
        return a;
      }
      return data[pascal];
    }

    const projectName = document.getElementById("projectName");
    const runtimeStatus = document.getElementById("runtimeStatus");
    const driverOnlineCount = document.getElementById("driverOnlineCount");
    const driverRows = document.getElementById("driverRows");
    const deviceRows = document.getElementById("deviceRows");
    const gpioIoRows = document.getElementById("gpioIoRows");
    const varsRows = document.getElementById("varsRows");
    const lastUpdate = document.getElementById("lastUpdate");
    const taskOperationState = document.getElementById("taskOperationState");

    function setStatus(isRunning) {
      runtimeStatus.innerHTML = isRunning
        ? '<span class="pill ok">RUNNING</span>'
        : '<span class="pill warn">STOPPED</span>';
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function formatVarValue(v) {
      if (v === null || v === undefined) {
        return "";
      }
      if (typeof v === "object") {
        try {
          return JSON.stringify(v);
        } catch {
          return String(v);
        }
      }
      return String(v);
    }

    function renderVars(vars) {
      const obj = vars && typeof vars === "object" ? vars : {};
      const keys = Object.keys(obj).sort((a, b) => a.localeCompare(b, undefined, { sensitivity: "base" }));
      if (!keys.length) {
        varsRows.innerHTML = '<tr><td colspan="2" style="color:#90a4d4">（无变量）</td></tr>';
        return;
      }
      varsRows.innerHTML = keys.map((k) => {
        const display = formatVarValue(obj[k]);
        return `<tr><td class="var-key">${escapeHtml(k)}</td><td class="var-value">${escapeHtml(display)}</td></tr>`;
      }).join("");
    }

    function renderDrivers(drivers) {
      const entries = Object.entries(drivers || {});
      let online = 0;
      driverRows.innerHTML = entries.map(([id, d]) => {
        const up = !!d.isConnected;
        if (up) online++;
        return `<tr>
          <td>${escapeHtml(id)}</td>
          <td>${escapeHtml(d.type || "-")}</td>
          <td><span class="dot ${up ? "ok" : ""}"></span>${up ? "Connected" : "Disconnected"}</td>
        </tr>`;
      }).join("");
      driverOnlineCount.textContent = String(online);
      if (!entries.length) {
        driverRows.innerHTML = '<tr><td colspan="3" style="color:#90a4d4">No drivers</td></tr>';
      }
    }

    function renderGpioIo(devices) {
      const flat = [];
      const obj = devices && typeof devices === "object" ? devices : {};
      for (const [devId, d] of Object.entries(obj)) {
        const pts = d.gpioIoPoints ?? d.GpioIoPoints;
        if (!Array.isArray(pts) || !pts.length) {
          continue;
        }
        for (const p of pts) {
          const alias = p.alias ?? p.Alias ?? "-";
          const dir = p.direction ?? p.Direction ?? "-";
          const drv = p.driverId ?? p.DriverId ?? "-";
          const addr = p.address ?? p.Address ?? "-";
          const online = !!(p.driverOnline ?? p.DriverOnline);
          const val = p.value ?? p.Value;
          const valStr = val === null || val === undefined ? "—" : String(val);
          flat.push({ devId, alias, dir, drv, addr, online, valStr });
        }
      }
      if (!flat.length) {
        gpioIoRows.innerHTML = '<tr><td colspan="7" style="color:#90a4d4">（无 GPIO 映射或暂无数据）</td></tr>';
        return;
      }
      gpioIoRows.innerHTML = flat
        .map(
          (r) => `<tr>
          <td>${escapeHtml(r.devId)}</td>
          <td>${escapeHtml(r.alias)}</td>
          <td>${escapeHtml(r.dir)}</td>
          <td>${escapeHtml(r.drv)}</td>
          <td>${escapeHtml(r.addr)}</td>
          <td><span class="dot ${r.online ? "ok" : ""}"></span>${r.online ? "Yes" : "No"}</td>
          <td style="font-family:ui-monospace,Consolas,monospace;font-size:12px">${escapeHtml(r.valStr)}</td>
        </tr>`
        )
        .join("");
    }

    const PLATFORM_TYPES = new Set(["platform", "xy", "xyz", "xyzu", "xyzuv", "xyzuvw"]);

    function isPlatformDeviceType(type) {
      return PLATFORM_TYPES.has(String(type || "").toLowerCase());
    }

    function renderDevices(devices) {
      const entries = Object.entries(devices || {});
      deviceRows.innerHTML = entries.map(([id, d]) => {
        const up = !!d.driverConnected;
        const name = d.name ?? d.Name ?? "-";
        const type = d.type ?? d.Type ?? "-";
        const state = d.state ?? d.State ?? "-";
        const driverType = d.driverType ?? d.DriverType ?? "-";
        const debugCell = isPlatformDeviceType(type)
          ? `<a class="link-btn" href="/monitorPlatform.html?deviceId=${encodeURIComponent(id)}">步进示教</a>`
          : "—";
        return `<tr>
          <td>${escapeHtml(id)}</td>
          <td>${escapeHtml(String(name))}</td>
          <td>${escapeHtml(String(type))}</td>
          <td>${escapeHtml(String(state))}</td>
          <td>${escapeHtml(String(driverType))}</td>
          <td><span class="dot ${up ? "ok" : ""}"></span>${up ? "Yes" : "No"}</td>
          <td>${debugCell}</td>
        </tr>`;
      }).join("");
      if (!entries.length) {
        deviceRows.innerHTML = '<tr><td colspan="7" style="color:#90a4d4">（无设备）</td></tr>';
      }
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("http " + res.status);
        const data = await res.json();
        projectName.textContent = snapshotField(data, "projectName", "ProjectName") || "-";
        setStatus(!!snapshotField(data, "isRunning", "IsRunning"));
        renderDrivers(snapshotField(data, "drivers", "Drivers"));
        const devicesObj = snapshotField(data, "devices", "Devices");
        renderDevices(devicesObj);
        renderGpioIo(devicesObj);
        const vars = snapshotField(data, "vars", "Vars") || {};
        renderVars(vars);
        const state = vars["task.operation.state"] ?? "unknown";
        const lamp = vars["task.operation.lamp"] ?? "red";
        const message = vars["task.operation.message"] ?? "-";
        taskOperationState.textContent = `状态: ${state} | 灯色: ${lamp} | 说明: ${message}`;
        lastUpdate.textContent = new Date().toLocaleTimeString();
      } catch (err) {
        runtimeStatus.innerHTML = '<span class="pill warn">UNREACHABLE</span>';
        varsRows.innerHTML = '<tr><td colspan="2" style="color:#90a4d4">无法加载</td></tr>';
        gpioIoRows.innerHTML = '<tr><td colspan="7" style="color:#90a4d4">无法加载</td></tr>';
      }
    }

    async function sendTaskAction(url) {
      try {
        const res = await fetch(url, { method: "POST" });
        if (!res.ok) throw new Error("http " + res.status);
        await tick();
      } catch (err) {
        taskOperationState.textContent = "状态: 操作失败";
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
