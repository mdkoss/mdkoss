<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 贴片循环监控</title>
  <style>
    :root {
      --bg: #1a1f26;
      --text: #e8edf2;
      --muted: #9aa8b5;
      --ok: #2db87c;
      --warn: #d4a017;
      --danger: #e05454;
      --line: #3d4a57;
      --accent: #00a3a1;
      --panel: #2a323c;
      --mode-band: #00a3a1;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      border-top: 3px solid var(--mode-band);
    }
    .wrap { max-width: 1280px; margin: 0 auto; padding: 20px; }
    .header {
      display: flex; justify-content: space-between; align-items: flex-end;
      gap: 12px; flex-wrap: wrap; margin-bottom: 16px;
    }
    .title { font-size: 22px; font-weight: 700; }
    .sub { color: var(--muted); font-size: 13px; margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    button, .link-btn {
      border: 1px solid var(--line);
      background: #232a33;
      color: var(--text);
      border-radius: 4px;
      padding: 9px 14px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      font-size: 13px;
    }
    button.primary { background: rgba(0,163,161,.18); border-color: var(--accent); color: var(--accent); }
    button.danger { background: rgba(224,84,84,.14); border-color: rgba(224,84,84,.45); color: var(--danger); }
    button:hover, .link-btn:hover { filter: brightness(1.08); }
    .grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 12px;
    }
    @media (max-width: 960px) { .grid { grid-template-columns: 1fr; } }
    .card {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 14px;
    }
    .card h3 {
      margin: 0 0 10px 0;
      font-size: 15px;
      display: flex; align-items: center; gap: 8px;
    }
    .badge {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      font-size: 11px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-weight: 700;
    }
    .badge.ok { color: var(--ok); border-color: rgba(45,184,124,.45); background: rgba(45,184,124,.12); }
    .badge.warn { color: var(--warn); border-color: rgba(212,160,23,.45); background: rgba(212,160,23,.12); }
    .badge.err { color: var(--danger); border-color: rgba(224,84,84,.45); background: rgba(224,84,84,.12); }
    .kv { display: grid; grid-template-columns: 140px 1fr; gap: 6px 10px; font-size: 13px; }
    .kv .k { color: var(--muted); }
    .kv .v { font-family: Consolas, "Cascadia Mono", monospace; font-weight: 700; }
    .flow { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 12px; }
    .step {
      padding: 6px 10px;
      border-radius: 4px;
      border: 1px solid var(--line);
      font-size: 12px;
      color: var(--muted);
      background: #151a20;
    }
    .step.active {
      color: var(--text);
      border-color: rgba(0,163,161,.55);
      background: rgba(0,163,161,.16);
    }
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-top: 12px;
    }
    .stat {
      background: #151a20;
      border: 1px solid var(--line);
      border-radius: 4px;
      padding: 12px;
      text-align: center;
    }
    .stat .n { font-size: 22px; font-weight: 700; font-family: Consolas, monospace; }
    .stat .l { font-size: 12px; color: var(--muted); margin-top: 4px; }
    .links { margin-top: 14px; font-size: 13px; color: var(--muted); }
    .links a { color: var(--accent); text-decoration: none; margin-right: 12px; }
    .links a:hover { text-decoration: underline; }
    .msg {
      margin-top: 10px;
      padding: 10px 12px;
      border-radius: 4px;
      background: #151a20;
      border: 1px solid var(--line);
      font-size: 13px;
      min-height: 40px;
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">贴片循环监控</div>
        <div class="sub">晶圆盘 → 下视定位 → 顶针拾取 → 上视测角 → 贴装基板 → nest 推进</div>
      </div>
      <div class="actions">
        <button class="primary" id="btnStart" type="button">启动</button>
        <button class="danger" id="btnStop" type="button">停止</button>
        <button id="btnReset" type="button">复位</button>
        <button id="btnTray" type="button">换盘</button>
      </div>
    </div>

    <div class="grid">
      <section class="card">
        <h3>循环状态 <span class="badge" id="phaseBadge">—</span></h3>
        <div class="kv">
          <div class="k">Phase</div><div class="v" id="phase">—</div>
          <div class="k">传送带</div><div class="v" id="conveyor">—</div>
          <div class="k">晶圆盘到位</div><div class="v" id="srcPresent">—</div>
          <div class="k">基板到位</div><div class="v" id="tgtPresent">—</div>
          <div class="k">换盘请求</div><div class="v" id="trayReq">—</div>
          <div class="k">配方</div><div class="v" id="recipe">—</div>
        </div>
        <div class="msg" id="message">等待状态…</div>
        <div class="flow" id="flow"></div>
        <div class="stats">
          <div class="stat"><div class="n" id="okCount">0</div><div class="l">OK</div></div>
          <div class="stat"><div class="n" id="ngCount">0</div><div class="l">NG</div></div>
          <div class="stat"><div class="n" id="yield">—</div><div class="l">良率</div></div>
        </div>
      </section>

      <section class="card">
        <h3>视觉结果</h3>
        <div class="kv">
          <div class="k">下视 X</div><div class="v" id="topX">—</div>
          <div class="k">下视 Y</div><div class="v" id="topY">—</div>
          <div class="k">下视 OK</div><div class="v" id="topOk">—</div>
          <div class="k">上视角度°</div><div class="v" id="angle">—</div>
          <div class="k">角度 OK</div><div class="v" id="angleOk">—</div>
        </div>
        <div class="links">
          <a href="/indexDieBonder.html">贴片机主界面</a>
          <a href="/index.html">系统主界面</a>
          <a href="/monitor_runtime.html">运行总览</a>
          <a href="/monitor_io.html">IO 监控</a>
          <a href="/debug_platform.html?deviceId=head-bond">平台示教</a>
          <a href="/debug_machine.html">整机调试</a>
          <a href="/monitor_io.html">IO 监控</a>
          <a href="/monitor_platform.html?deviceId=head-bond">贴装头监控</a>
          <a href="/debug_platform.html?deviceId=head-bond">贴装头示教</a>
          <a href="/monitor_runtime.html">综合监控</a>
        </div>
      </section>
    </div>
  </div>

  <script>
    const STEPS = [
      "Idle", "WaitTrays", "CheckSafety", "LocateDownlook",
      "MovePickSafe", "MovePickXy", "EjectorOn", "DescendPick", "VacuumOn", "AscendPick", "EjectorOff",
      "MoveUplook", "MeasureAngle", "CalcPlace",
      "MovePlaceSafe", "MovePlaceXyU", "Dispense", "DescendPlace", "VacuumOff", "AscendPlace",
      "AdvanceNests", "RequestTrayChange", "Fault"
    ];

    const flow = document.getElementById("flow");
    STEPS.forEach((s) => {
      const el = document.createElement("div");
      el.className = "step";
      el.dataset.phase = s;
      el.textContent = s;
      flow.appendChild(el);
    });

    function setText(id, value) {
      document.getElementById(id).textContent = value == null || value === "" ? "—" : String(value);
    }

    function badgeClass(phase) {
      if (phase === "Fault") return "badge err";
      if (phase === "Idle") return "badge";
      if (phase === "RequestTrayChange") return "badge warn";
      return "badge ok";
    }

    async function post(action) {
      await fetch(`/api/bond/${action}`, { method: "POST" });
      await refresh();
    }

    async function refresh() {
      try {
        const res = await fetch("/api/bond/status");
        const data = await res.json();
        const phase = data.phase || "—";
        setText("phase", phase);
        setText("message", data.message);
        setText("conveyor", data.conveyorPhase);
        setText("srcPresent", data.srcTrayPresent);
        setText("tgtPresent", data.tgtTrayPresent);
        setText("trayReq", data.trayChangeRequest);
        setText("recipe", data.activeRecipeId);
        setText("okCount", data.okCount);
        setText("ngCount", data.ngCount);
        const ok = Number(data.okCount) || 0;
        const ng = Number(data.ngCount) || 0;
        const total = ok + ng;
        setText("yield", total ? ((ok / total) * 100).toFixed(1) + "%" : "—");
        setText("topX", data.vision?.topX);
        setText("topY", data.vision?.topY);
        setText("topOk", data.vision?.topOk);
        setText("angle", data.vision?.angleDeg);
        setText("angleOk", data.vision?.angleOk);
        const badge = document.getElementById("phaseBadge");
        badge.className = badgeClass(phase);
        badge.textContent = phase;
        document.querySelectorAll(".step").forEach((el) => {
          el.classList.toggle("active", el.dataset.phase === phase);
        });
      } catch (e) {
        setText("message", "状态刷新失败: " + e);
      }
    }

    document.getElementById("btnStart").onclick = () => post("start");
    document.getElementById("btnStop").onclick = () => post("stop");
    document.getElementById("btnReset").onclick = () => post("reset");
    document.getElementById("btnTray").onclick = () => post("traychange");
    refresh();
    setInterval(refresh, 500);
  </script>
</body>
</html>
