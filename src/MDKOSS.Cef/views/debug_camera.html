<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 相机调试</title>
  <link rel="stylesheet" href="/css/theme-debug.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="debug" data-tool-page="debug_camera">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">相机调试 <span class="pill warn">可写</span></div>
        <div class="sub">/api/extcamera/*（扩展未加载时不可用）</div>
      </div>
      <a class="link-btn" href="/monitor_camera.html">只读监控 →</a>
    </div>
    <div class="writable-note">
      调试模式可写。触发/状态刷新无需确认；关闭相机需确认。
      <a href="/monitor_camera.html">相机监控（只读）</a>
    </div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>相机设备</label>
        <select id="selCam"><option value="">— 选择 —</option></select>
      </div>
    </div>
    <div class="btn-group" style="margin-bottom:12px">
      <button type="button" class="btn primary" id="btnOpen">打开</button>
      <button type="button" class="btn" id="btnTrigger">触发</button>
      <button type="button" class="btn danger" id="btnClose">关闭</button>
      <button type="button" class="btn" id="btnStatus">刷新状态</button>
    </div>
    <div class="card">
      <div class="label">状态</div>
      <pre id="out" style="margin-top:8px;white-space:pre-wrap">—</pre>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script>
    const { esc, field, qs, fetchJson, postJson, toast, confirmWrite } = MdkTool;
    const CAM = new Set(["cameradev", "camera", "extcamera"]);
    const sel = document.getElementById("selCam");
    const out = document.getElementById("out");
    let preferred = qs("deviceId", "");

    async function refreshDevices() {
      const data = await fetchJson("/api/status");
      const devices = field(data, "devices", "Devices") || {};
      const cur = sel.value || preferred;
      const opts = Object.entries(devices)
        .filter(([, d]) => CAM.has(String(field(d, "type", "Type") || "").toLowerCase()))
        .map(([id, d]) => `<option value="${esc(id)}">${esc(field(d, "name", "Name") || id)}</option>`);
      sel.innerHTML = '<option value="">— 选择 —</option>' + opts.join("");
      if (cur && [...sel.options].some((o) => o.value === cur)) sel.value = cur;
      else if (sel.options.length > 1) sel.selectedIndex = 1;
      preferred = "";
    }

    async function callExt(path, body) {
      const id = sel.value;
      if (!id) { toast("请选择相机", false); return; }
      const url = path.includes("?") ? `${path}&deviceId=${encodeURIComponent(id)}` : `${path}?deviceId=${encodeURIComponent(id)}`;
      if (body) return postJson(url, Object.assign({ deviceId: id }, body));
      if (path.includes("status")) return fetchJson(url);
      return postJson(url, { deviceId: id });
    }

    async function call(path, action) {
      const id = sel.value;
      if (!id) { toast("请选择相机", false); return; }
      try {
        let data;
        try {
          data = await callExt(path);
        } catch (extErr) {
          if (!action) throw extErr;
          data = await postJson(`/api/devices/${encodeURIComponent(id)}/action`, { action });
        }
        out.textContent = JSON.stringify(data, null, 2);
        toast("成功", true);
      } catch (e) {
        out.textContent = e.message || String(e);
        toast(e.message || "失败", false);
      }
    }

    document.getElementById("btnOpen").onclick = () => call("/api/extcamera/open");
    document.getElementById("btnClose").onclick = () => {
      if (!confirmWrite("确认关闭相机？", "设备: " + (sel.value || "—"))) return;
      call("/api/extcamera/close");
    };
    document.getElementById("btnTrigger").onclick = () => call("/api/extcamera/trigger", "trigger");
    document.getElementById("btnStatus").onclick = () => call("/api/extcamera/status", "status");

    refreshDevices().catch((e) => { out.textContent = e.message; });
    setInterval(() => refreshDevices().catch(() => {}), 3000);
  </script>
</body>
</html>
