<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设备配置</title>
  <link rel="stylesheet" href="/css/debug.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    .man-layout { display:grid; grid-template-columns: minmax(220px,320px) 1fr; gap:16px; }
    @media (max-width:900px){ .man-layout{ grid-template-columns:1fr; } }
    .man-note { color:var(--warn); font-size:12px; margin-top:8px; }
  </style>
</head>
<body data-tool-group="man" data-tool-page="man_device" data-man-kind="devices">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">设备配置 <span class="pill warn">配置</span></div>
        <div class="sub" id="manMeta">name / driverId / parameters</div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn primary" id="btnApplyPatch">应用修改</button>
        <button type="button" class="btn" id="btnSaveDisk">保存到磁盘</button>
      </div>
    </div>
    <p class="man-note">PATCH 仅改内存 Setting；保存后需重启运行时，设备/驱动变更才会生效。</p>
    <div class="man-layout" style="margin-top:12px">
      <div class="card"><div class="label">列表</div><div id="manList" style="margin-top:8px"></div></div>
      <div class="card"><div class="label">编辑</div><div id="manForm" style="margin-top:8px"></div></div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script src="/js/man_editor.js"></script>
</body>
</html>
