<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 平台步进示教</title>
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="debug" data-tool-page="debug_platform">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">平台步进示教</div>
        <div class="sub" id="hdrSubtitle">请选择平台设备</div>
      </div>
    </div>
    <div id="warnBar" class="warn-bar hidden">运行时未启动，仍可调试平台。</div>
    <div class="form-row">
      <div class="form-group" style="flex:2">
        <label>平台设备</label>
        <select id="selPlatform"><option value="">— 选择平台 —</option></select>
      </div>
      <div class="form-group">
        <label>项目</label>
        <div id="badgeProject" style="padding:8px 0">—</div>
      </div>
      <div class="form-group">
        <label>运行</label>
        <div id="badgeRuntime">—</div>
      </div>
    </div>
    <div class="sub" style="margin-bottom:12px">刷新: <span id="pollHint">1s</span></div>
    <div class="main-layout">
      <div class="card">
        <h2 class="panel-title">步进</h2>
        <div class="form-row">
          <div class="form-group"><label>模式</label><select id="selMode"><option value="default">默认</option><option value="joint">关节</option><option value="world">世界</option></select></div>
          <div class="form-group"><label>速度</label><select id="selSpeed"><option value="low">低</option><option value="medium">中</option><option value="high">高</option></select></div>
        </div>
        <div id="jogGrid" class="jog-grid"></div>
        <div class="btn-group">
          <button type="button" class="btn primary" id="btnEnable">平台使能</button>
          <button type="button" class="btn danger" id="btnDisable">平台去使能</button>
        </div>
      </div>
      <div class="card">
        <h2 class="panel-title">目前位置</h2>
        <div class="radio-row">
          <label><input type="radio" name="coord" value="world" /> 世界 (W)</label>
          <label><input type="radio" name="coord" value="joint" checked /> 关节 (J)</label>
          <label><input type="radio" name="coord" value="pulse" /> 脉冲 (U)</label>
        </div>
        <div class="pos-grid">
          <div class="pos-field" id="posField_X">
            <label>X <span id="unit_X">mm</span></label>
            <input type="text" id="pos_X" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_Y">
            <label>Y <span id="unit_Y">mm</span></label>
            <input type="text" id="pos_Y" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_Z">
            <label>Z <span id="unit_Z">mm</span></label>
            <input type="text" id="pos_Z" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_U">
            <label>U <span id="unit_U">mm</span></label>
            <input type="text" id="pos_U" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_V">
            <label>V <span id="unit_V">mm</span></label>
            <input type="text" id="pos_V" readonly value="—" />
          </div>
          <div class="pos-field" id="posField_W">
            <label>W <span id="unit_W">mm</span></label>
            <input type="text" id="pos_W" readonly value="—" />
          </div>
        </div>
        <h2 class="panel-title">平台与轴状态</h2>
        <div class="meta-row">
          <div><span>类型 </span><strong id="metaKind">—</strong></div>
          <div><span>使能 </span><span id="metaMotion">—</span></div>
          <div><span>状态 </span><strong id="metaState">—</strong></div>
        </div>
        <div class="table-wrap"><table><thead><tr><th>轴</th><th>子设备</th><th>驱动</th><th>在线</th><th>使能</th><th>备注</th></tr></thead><tbody id="axisTableBody"></tbody></table></div>
        <h2 class="panel-title">步进距离</h2>
        <div class="radio-row">
          <label><input type="radio" name="stepPreset" value="continuous" checked /> 连续 (C)</label>
          <label><input type="radio" name="stepPreset" value="long" /> 长 (L)</label>
          <label><input type="radio" name="stepPreset" value="medium" /> 中 (M)</label>
          <label><input type="radio" name="stepPreset" value="short" /> 短 (S)</label>
        </div>
        <div class="form-row">
          <div class="form-group"><label>X 步距</label><input type="number" id="step_X" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>Y 步距</label><input type="number" id="step_Y" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>Z 步距</label><input type="number" id="step_Z" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>U 步距</label><input type="number" id="step_U" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>V 步距</label><input type="number" id="step_V" step="0.001" value="1" disabled /></div>
          <div class="form-group"><label>W 步距</label><input type="number" id="step_W" step="0.001" value="1" disabled /></div>
        </div>
      </div>
    </div>
    <div class="card bottom-card">
      <div class="tabs">
        <button type="button" class="tab active" data-tab="teach">示教点</button>
        <button type="button" class="tab" data-tab="action">执行动作</button>
        <button type="button" class="tab" data-tab="io">关联 IO</button>
      </div>
      <div id="panel-teach" class="tab-panel active">
        <div class="form-row">
          <div class="form-group"><label>点文件</label><select id="selTeachFile"><option value="default">default.pts.json</option></select></div>
          <div class="form-group"><label>点</label><select id="selPoint"></select></div>
        </div>
        <div class="btn-group">
          <button type="button" class="btn primary" id="btnTeach">示教 (T)</button>
          <button type="button" class="btn" id="btnGoto">定位</button>
          <button type="button" class="btn" id="btnAddPoint">新增点</button>
          <button type="button" class="btn" id="btnExport">导出</button>
          <label class="btn">导入<input type="file" id="importFile" accept=".json" hidden /></label>
        </div>
      </div>
      <div id="panel-action" class="tab-panel">
        <div class="form-row">
          <div class="form-group"><label>设备 ID</label><input type="text" id="customDevice" placeholder="platformId 或 axisId" /></div>
          <div class="form-group"><label>action</label><input type="text" id="customAction" placeholder="enable / move" /></div>
        </div>
        <div class="form-group"><label>parameters (JSON)</label><textarea id="customParams" rows="2">{}</textarea></div>
        <button type="button" class="btn primary" id="btnCustomAction">执行</button>
        <div class="log-box" id="actionLog"></div>
      </div>
      <div id="panel-io" class="tab-panel">
        <div class="table-wrap"><table><thead><tr><th>ID</th><th>名称</th><th>类型</th><th>状态</th><th>链接</th></tr></thead><tbody id="ioTableBody"></tbody></table></div>
      </div>
    </div>
    <p class="footer">API: <code>/api/status</code> · <code>/api/devices/{id}/action</code></p>
  </div>
<script src="debug_platform.js"></script>
  <script src="/js/tool_nav.js"></script>
</body>
</html>
