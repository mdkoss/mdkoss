<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>整机配置</title>
  <link rel="stylesheet" href="/css/theme-man.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="man" data-tool-page="man_machine" data-man-kind="machine">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">整机配置 <span class="pill warn">配置</span></div>
        <div class="sub" id="manMeta">projectName / cycleMs / 路径</div>
      </div>
      <div class="btn-group compact-btns">
        <button type="button" class="btn" id="btnAdd">新建</button>
        <button type="button" class="btn" id="btnDup">复制</button>
        <button type="button" class="btn danger" id="btnDel">删除</button>
        <button type="button" class="btn primary" id="btnApplyPatch">应用属性</button>
        <button type="button" class="btn" id="btnSaveDisk">保存到磁盘</button>
      </div>
    </div>
    <p class="man-note">简化配置：编辑项目名、周期、监控前缀等整机参数。不可增删。</p>
    <div class="man-toolbar">
      <input type="search" id="manFilter" class="filter" placeholder="查找参数键…" autocomplete="off" />
    </div>
    <div class="man-layout">
      <div class="card">
        <div class="label">组件列表</div>
        <div class="table-scroll">
          <table>
            <thead id="manHead"></thead>
            <tbody id="manList"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="label" id="manFormTitle">属性</div>
        <div id="manForm"></div>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script src="/js/man_editor.js"></script>
</body>
</html>
