<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 主界面</title>
  <link rel="stylesheet" href="/css/theme-navy.css" />
  <link rel="stylesheet" href="/css/main.css" />
</head>
<body>
  <div class="backdrop" id="backdrop"></div>

  <header class="topbar">
    <div class="topbar-inner" id="topbarInner">
      <div class="brand">
        <div class="brand-icon" title="MDKOSS">M</div>
        <div class="brand-name" id="deviceName" title="设备名称">—</div>
      </div>

      <button class="nav-btn" type="button" data-popup="popup_devices" data-title="设备组件"><span class="ico">⚙</span>组件</button>
      <button class="nav-btn" type="button" data-popup="popup_tasks" data-title="任务状态"><span class="ico">▶</span>任务</button>
      <button class="nav-btn" type="button" data-popup="popup_vars" data-title="运行变量"><span class="ico">𝑥</span>变量</button>
      <button class="nav-btn" type="button" data-popup="popup_alarms" data-title="报警 / 异常"><span class="ico">⚠</span>报警</button>
      <button class="nav-btn" type="button" data-popup="popup_order" data-title="工单详情" data-wide="1"><span class="ico">☰</span>工单</button>
      <button class="nav-btn" type="button" data-popup="popup_user" data-title="当前用户"><span class="ico">👤</span>用户</button>
      <button class="nav-btn" type="button" data-popup="popup_about" data-title="关于 / 工具目录" data-wide="1"><span class="ico">ℹ</span>关于</button>
      <button class="nav-btn" type="button" id="btnHmi" hidden title="主界面监控组态"><span class="ico">▦</span>组态</button>

      <div class="alarm-lamp-wrap" title="三色报警灯（来自 task.operation.lamp）">
        <span class="alarm-lamp-label">报警灯</span>
        <div class="alarm-lamp" id="alarmLamp"></div>
      </div>
    </div>
  </header>

  <main class="main">
    <div class="main-header">
      <div class="main-title">订单列表</div>
      <div class="main-sub" id="orderListMeta">—</div>
    </div>
    <div class="order-panel">
      <div class="order-table-wrap">
        <table class="order-table">
          <thead>
            <tr>
              <th>订单号</th>
              <th>产品</th>
              <th>数量</th>
              <th>状态</th>
              <th>进度</th>
              <th>更新时间</th>
            </tr>
          </thead>
          <tbody id="orderRows"></tbody>
        </table>
      </div>
    </div>
  </main>

  <footer class="bottombar">
    <div class="bottom-section bottom-order">
      <div class="bottom-label">当前订单</div>
      <div class="bottom-value" id="currentOrderId">—</div>
      <div class="bottom-meta" id="currentOrderDetail">—</div>
    </div>
    <div class="bottom-section bottom-status">
      <div class="bottom-label">重要状态监控</div>
      <div class="status-grid" id="statusGrid">
        <div class="status-chip"><span class="dot" id="dotRuntime"></span><span id="lblRuntime">运行时 —</span></div>
        <div class="status-chip"><span class="dot" id="dotIo"></span><span id="lblIo">驱动 —</span></div>
        <div class="status-chip"><span class="dot" id="dotDev"></span><span id="lblDev">设备 —</span></div>
        <div class="status-chip"><span class="dot" id="dotTask"></span><span id="lblTaskOp">任务 —</span></div>
      </div>
    </div>
    <div class="bottom-right">
      <div class="bottom-section bottom-recipe">
        <div class="bottom-label">当前配方</div>
        <div class="recipe-row">
          <div class="recipe-info">
            <div class="bottom-value" id="currentRecipeName">—</div>
            <div class="bottom-meta" id="currentRecipeId">—</div>
          </div>
          <button class="recipe-pick-btn" type="button" id="btnPickRecipe">选择配方</button>
        </div>
      </div>
      <div class="bottom-ctrl">
        <button class="ctrl-btn start" type="button" id="btnStart">启动</button>
        <button class="ctrl-btn stop" type="button" id="btnStop">停止</button>
        <button class="ctrl-btn reset" type="button" id="btnReset">复位</button>
      </div>
    </div>
  </footer>

  <div class="popup-modal" id="popupModal" aria-hidden="true">
    <div class="popup-dialog" id="popupDialog" role="dialog" aria-labelledby="popupTitle">
      <div class="popup-dialog-head">
        <span id="popupTitle">弹窗</span>
        <button class="popup-dialog-close" type="button" id="btnPopupClose" aria-label="关闭">×</button>
      </div>
      <iframe class="popup-frame" id="popupFrame" title="popup" src="about:blank"></iframe>
    </div>
  </div>

  <script>
    function snapshotField(data, camel, pascal) {
      const a = data[camel];
      if (a !== undefined && a !== null) return a;
      return data[pascal];
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function varStr(vars, key, fallback) {
      const v = vars[key];
      if (v === null || v === undefined || v === "") return fallback;
      return String(v);
    }

    function varNum(vars, key, fallback) {
      const v = vars[key];
      if (v === null || v === undefined) return fallback;
      const n = Number(v);
      return Number.isFinite(n) ? n : fallback;
    }

    let selectedOrderId = null;

    const alarmLamp = document.getElementById("alarmLamp");
    const deviceName = document.getElementById("deviceName");
    const orderRows = document.getElementById("orderRows");
    const orderListMeta = document.getElementById("orderListMeta");
    const currentOrderId = document.getElementById("currentOrderId");
    const currentOrderDetail = document.getElementById("currentOrderDetail");
    const currentRecipeName = document.getElementById("currentRecipeName");
    const currentRecipeId = document.getElementById("currentRecipeId");
    const popupModal = document.getElementById("popupModal");
    const popupDialog = document.getElementById("popupDialog");
    const popupTitle = document.getElementById("popupTitle");
    const popupFrame = document.getElementById("popupFrame");
    const btnPopupClose = document.getElementById("btnPopupClose");
    /** @type {string|null} name|wide|orderId of the open popup; null when closed */
    let currentPopupKey = null;

    function buildPopupKey(name, opts) {
      opts = opts || {};
      return `${name}|${opts.wide ? "1" : "0"}|${opts.orderId || ""}`;
    }

    function syncPopupNav(name) {
      document.querySelectorAll(".nav-btn[data-popup]").forEach((b) => {
        b.classList.toggle("active", !!name && b.getAttribute("data-popup") === name);
      });
    }

    function openPopup(name, title, opts) {
      opts = opts || {};
      const key = buildPopupKey(name, opts);
      if (popupModal.classList.contains("open") && currentPopupKey === key) {
        closePopup(false);
        return;
      }
      const needReload = currentPopupKey !== key;
      popupTitle.textContent = title || name;
      popupDialog.classList.toggle("wide", !!opts.wide);
      if (needReload) {
        const qs = new URLSearchParams({ embedded: "1" });
        if (opts.orderId) qs.set("orderId", String(opts.orderId));
        popupFrame.src = `/${name}.html?${qs.toString()}`;
      }
      currentPopupKey = key;
      popupModal.classList.add("open");
      popupModal.setAttribute("aria-hidden", "false");
      syncPopupNav(name);
      try { btnPopupClose.focus(); } catch { /* ignore */ }
    }

    function closePopup(refresh) {
      if (!popupModal.classList.contains("open") && !currentPopupKey) {
        if (refresh) tick();
        return;
      }
      popupModal.classList.remove("open");
      popupModal.setAttribute("aria-hidden", "true");
      popupFrame.src = "about:blank";
      currentPopupKey = null;
      syncPopupNav(null);
      if (refresh) tick();
    }

    document.querySelectorAll(".nav-btn[data-popup]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const name = btn.getAttribute("data-popup");
        const title = btn.getAttribute("data-title") || name;
        const wide = btn.getAttribute("data-wide") === "1";
        const opts = { wide };
        if (name === "popup_order" && selectedOrderId) opts.orderId = selectedOrderId;
        openPopup(name, title, opts);
      });
    });

    btnPopupClose.addEventListener("click", () => closePopup(false));
    popupModal.addEventListener("click", (e) => {
      if (e.target === popupModal) closePopup(false);
    });
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape" && popupModal.classList.contains("open")) closePopup(false);
    });
    window.addEventListener("message", (e) => {
      const msg = e.data;
      if (msg && msg.type === "mdkoss-popup-close") closePopup(!!msg.refresh);
    });

    document.getElementById("btnPickRecipe").addEventListener("click", () => {
      openPopup("popup_recipe", "选择配方", {});
    });

    const btnHmi = document.getElementById("btnHmi");
    btnHmi.addEventListener("click", () => { location.href = "/index_hmi.html"; });
    fetch("/api/hmi/widgets", { cache: "no-store" })
      .then((r) => { if (r.ok) btnHmi.hidden = false; })
      .catch(() => {});

    function parseOrders(vars) {
      const raw = vars["order.list"] ?? vars["order.list.json"];
      if (raw) {
        try {
          const arr = typeof raw === "string" ? JSON.parse(raw) : raw;
          if (Array.isArray(arr) && arr.length) return arr.map(normalizeOrder);
        } catch { /* fall through */ }
      }
      const id = varStr(vars, "order.current.id", "");
      if (id) {
        return [normalizeOrder({
          id,
          product: varStr(vars, "order.current.product", "—"),
          qty: varNum(vars, "order.current.qty", 1),
          status: varStr(vars, "order.current.status", "running"),
          progress: varNum(vars, "order.current.progress", 0),
          updatedAt: varStr(vars, "order.current.updatedAt", new Date().toLocaleString())
        })];
      }
      return [];
    }

    function fmtOrderTime(v) {
      if (v == null || v === "") return "—";
      const s = String(v);
      if (s.length >= 19 && s.includes("T")) return s.slice(0, 19).replace("T", " ");
      return s;
    }

    function normalizeOrder(o) {
      const fields = (o.fields && typeof o.fields === "object" && !Array.isArray(o.fields)) ? o.fields : {};
      return {
        id: o.id ?? o.Id ?? o.orderId ?? "—",
        product: o.product ?? o.Product ?? o.name ?? "—",
        qty: o.qty ?? o.Qty ?? o.quantity ?? 1,
        status: String(o.status ?? o.Status ?? "pending").toLowerCase(),
        progress: Math.min(100, Math.max(0, Number(o.progress ?? o.Progress ?? 0) || 0)),
        recipeId: o.recipeId ?? o.RecipeId ?? "",
        priority: o.priority ?? o.Priority ?? 0,
        notes: o.notes ?? o.Notes ?? "",
        updatedAt: fmtOrderTime(o.updatedAt ?? o.UpdatedAt ?? o.updatedAtUtc ?? o.UpdatedAtUtc ?? o.time ?? ""),
        fields
      };
    }

    function statusBadge(status) {
      const s = String(status).toLowerCase();
      const cls = s === "running" ? "running" : s === "pending" ? "pending" : s === "fault" || s === "error" ? "fault" : "done";
      const label = { running: "运行中", pending: "等待", done: "完成", fault: "故障", error: "故障" }[s] || status;
      return `<span class="badge ${cls}">${escapeHtml(label)}</span>`;
    }

    function renderOrders(orders) {
      if (!orders.length) {
        orderRows.innerHTML = '<tr><td colspan="6" style="color:var(--muted);padding:20px">暂无订单（可通过变量 order.list 注入）</td></tr>';
        orderListMeta.textContent = "0 条";
        return;
      }
      if (!selectedOrderId || !orders.some((o) => o.id === selectedOrderId)) {
        selectedOrderId = orders[0].id;
      }
      orderListMeta.textContent = `${orders.length} 条 · 选中 ${selectedOrderId}`;
      orderRows.innerHTML = orders.map((o) => {
        const sel = o.id === selectedOrderId ? " selected" : "";
        return `<tr class="${sel}" data-order-id="${escapeHtml(o.id)}">
          <td>${escapeHtml(o.id)}</td>
          <td>${escapeHtml(o.product)}</td>
          <td>${escapeHtml(String(o.qty))}</td>
          <td>${statusBadge(o.status)}</td>
          <td>${o.progress}%</td>
          <td>${escapeHtml(o.updatedAt)}</td>
        </tr>`;
      }).join("");
      orderRows.querySelectorAll("tr[data-order-id]").forEach((tr) => {
        tr.addEventListener("click", () => {
          selectedOrderId = tr.getAttribute("data-order-id");
          renderOrders(orders);
        });
        tr.addEventListener("dblclick", () => {
          selectedOrderId = tr.getAttribute("data-order-id");
          openPopup("popup_order", "工单详情", { wide: true, orderId: selectedOrderId });
        });
      });
      updateCurrentOrder(orders.find((x) => x.id === selectedOrderId));
    }

    function updateCurrentRecipe(vars) {
      const name = varStr(vars, "recipe.activeName", "");
      const id = varStr(vars, "recipe.activeId", "");
      if (!name && !id) {
        currentRecipeName.textContent = "未选择";
        currentRecipeId.textContent = "—";
        return;
      }
      currentRecipeName.textContent = name || id;
      currentRecipeId.textContent = id ? `ID: ${id}` : "—";
    }

    function updateCurrentOrder(order) {
      if (!order) {
        currentOrderId.textContent = "—";
        currentOrderDetail.textContent = "—";
        return;
      }
      currentOrderId.textContent = order.id;
      currentOrderDetail.textContent = `${order.product} · ${order.qty} 件 · ${order.progress}%`;
    }

    function setLamp(lamp) {
      alarmLamp.className = "alarm-lamp";
      const c = String(lamp || "red").toLowerCase();
      if (c === "green") alarmLamp.classList.add("green");
      else if (c === "yellow") alarmLamp.classList.add("yellow");
    }

    function setDot(el, mode) {
      el.className = "dot";
      if (mode === "ok") el.classList.add("ok");
      else if (mode === "warn") el.classList.add("warn");
      else if (mode === "bad") el.classList.add("bad");
    }

    function renderBottomStatus(data, vars) {
      const isRunning = !!snapshotField(data, "isRunning", "IsRunning");
      setDot(document.getElementById("dotRuntime"), isRunning ? "ok" : "warn");
      document.getElementById("lblRuntime").textContent = isRunning ? "运行时 运行中" : "运行时 已停止";

      const ioOn = varNum(vars, "task.cycle.io.online", 0);
      const ioTot = varNum(vars, "task.cycle.io.total", 0);
      const ioOff = varNum(vars, "task.cycle.io.offline", Math.max(0, ioTot - ioOn));
      setDot(document.getElementById("dotIo"), ioOff > 0 ? "warn" : "ok");
      document.getElementById("lblIo").textContent = `驱动 ${ioOn}/${ioTot} 在线`;

      const devFault = varNum(vars, "task.cycle.dev.fault", 0);
      const devRun = varNum(vars, "task.cycle.dev.running", 0);
      setDot(document.getElementById("dotDev"), devFault > 0 ? "bad" : "ok");
      document.getElementById("lblDev").textContent = `设备 运行 ${devRun} · 故障 ${devFault}`;

      const opState = varStr(vars, "task.operation.state", "—");
      const opRun = vars["task.operation.running"];
      setDot(document.getElementById("dotTask"), opState === "fault" ? "bad" : opRun ? "ok" : "warn");
      document.getElementById("lblTaskOp").textContent = `操作 ${opState}`;

      setLamp(vars["task.operation.lamp"] ?? "red");
      document.getElementById("btnStart").disabled = opState === "running";
      document.getElementById("btnStop").disabled = opState === "stopped";
    }

    async function sendTaskAction(url) {
      try {
        const res = await fetch(url, { method: "POST" });
        if (!res.ok) throw new Error("http " + res.status);
        await tick();
      } catch {
        document.getElementById("lblTaskOp").textContent = "操作失败";
        setDot(document.getElementById("dotTask"), "bad");
      }
    }

    document.getElementById("btnStart").addEventListener("click", () => sendTaskAction("/api/task/start"));
    document.getElementById("btnStop").addEventListener("click", () => sendTaskAction("/api/task/stop"));
    document.getElementById("btnReset").addEventListener("click", () => sendTaskAction("/api/task/reset"));

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("http " + res.status);
        const data = await res.json();
        const vars = snapshotField(data, "vars", "Vars") || {};
        const project = snapshotField(data, "projectName", "ProjectName") || "MDKOSS";
        deviceName.textContent = varStr(vars, "machine.name", project);
        deviceName.title = deviceName.textContent;

        renderOrders(await loadOrders(vars));
        renderBottomStatus(data, vars);
        updateCurrentRecipe(vars);
      } catch {
        deviceName.textContent = "未连接";
        setDot(document.getElementById("dotRuntime"), "bad");
        document.getElementById("lblRuntime").textContent = "无法连接 /api/status";
      }
    }

    async function loadOrders(vars) {
      const fromVars = parseOrders(vars);
      if (fromVars.length) return fromVars;
      try {
        const res = await fetch("/api/orders", { cache: "no-store" });
        if (!res.ok) return [];
        const arr = await res.json();
        return Array.isArray(arr) ? arr.map(normalizeOrder) : [];
      } catch {
        return [];
      }
    }

    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
