<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>选择排单</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { margin: 0; background: var(--bg); }
    .popup-page { padding: 8px; }
    body.embedded .standalone-title { display: none; }
  </style>
</head>
<body>
  <div class="popup-page">
    <div class="standalone-title" style="font-weight:700;margin:8px 8px 12px">选择排单</div>
    <div id="body"><div class="recipe-dialog-empty">加载中…</div></div>
    <div style="padding:8px;font-size:12px"><a href="/man_recipe.html" target="_blank" style="color:var(--accent)">排单配置管理 →</a></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") document.body.classList.add("embedded");
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
    function field(d,a,b){return d[a]??d[b];}
    function notifyClose(){
      try { parent.postMessage({ type: "mdkoss-popup-close", refresh: true }, "*"); } catch {}
    }
    async function load(){
      const body = document.getElementById("body");
      body.innerHTML = '<div class="recipe-dialog-empty">加载中…</div>';
      try{
        const res = await fetch("/api/recipe",{cache:"no-store"});
        if(!res.ok) throw new Error("http");
        const data = await res.json();
        const activeId = field(data,"activeRecipeId","ActiveRecipeId") || "";
        const recipes = field(data,"recipes","Recipes") || [];
        if (!recipes.length) {
          body.innerHTML = '<div class="recipe-dialog-empty">暂无排单（请在 setting.json 中配置 recipes）</div>';
          return;
        }
        body.innerHTML = recipes.map(r=>{
          const id=r.id??r.Id??"—";
          const name=r.name??r.Name??id;
          const desc=r.description??r.Description??"";
          const active=String(id).toLowerCase()===String(activeId).toLowerCase()?" active":"";
          const meta=[id,desc].filter(Boolean).join(" · ");
          return `<button type="button" class="recipe-option${active}" data-id="${esc(id)}">
            <div class="recipe-option-name">${esc(name)}</div>
            <div class="recipe-option-meta">${esc(meta)}</div>
          </button>`;
        }).join("");
        body.querySelectorAll("button[data-id]").forEach(btn=>{
          btn.addEventListener("click",()=>apply(btn.getAttribute("data-id")));
        });
      }catch{
        body.innerHTML='<div class="recipe-dialog-empty">无法加载排单列表</div>';
      }
    }
    async function apply(id){
      if(!id) return;
      document.getElementById("body").innerHTML='<div class="recipe-dialog-empty">切换中…</div>';
      try{
        const res = await fetch(`/api/recipe/apply?id=${encodeURIComponent(id)}`,{method:"POST"});
        const data = await res.json().catch(()=>({}));
        if(!res.ok || data.success===false) throw new Error("fail");
        notifyClose();
      }catch{
        document.getElementById("body").innerHTML='<div class="recipe-dialog-empty">切换排单失败</div>';
        setTimeout(load, 1000);
      }
    }
    load();
  </script>
</body>
</html>
