<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS IO 监控</title>
  <link rel="stylesheet" href="/css/theme-monitor.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="monitor" data-tool-page="monitor_io">
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">IO 监控 <span class="pill warn">只读</span></div>
        <div class="sub">灯盘按设备分组 · 数据 /api/status</div>
      </div>
      <div class="header-actions" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
        <div class="view-toggle" role="group" aria-label="视图">
          <button type="button" class="active" data-view="led" id="btnViewLed">灯盘</button>
          <button type="button" data-view="table" id="btnViewTable">明细</button>
        </div>
        <a class="link-btn" href="/debug_io.html">强制输出 →</a>
      </div>
    </div>

    <div class="readonly-note">
      监控为只读。强制写入请进入
      <a href="/debug_io.html">IO 强制</a>
      或
      <a href="/debug_driver.html">驱动端口字</a>。
    </div>

    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group grow">
        <label>筛选</label>
        <input type="search" class="filter" id="ioFilter" placeholder="设备 ID、别名、驱动、地址…" autocomplete="off" style="margin:0" />
      </div>
      <div class="form-group shrink">
        <label>上次刷新</label>
        <div class="value" id="lastUpdate" style="font-size:14px">—</div>
      </div>
    </div>

    <div id="ledView">
      <div class="io-layout">
        <div class="card">
          <h2 class="panel-title">数字输入 DI</h2>
          <div class="led-panel" id="diLedPanel"></div>
        </div>
        <div class="card">
          <h2 class="panel-title">数字输出 DO</h2>
          <div class="led-panel" id="doLedPanel"></div>
        </div>
      </div>
    </div>

    <div id="tableView" hidden>
      <div class="io-layout">
        <div class="card">
          <h2 class="panel-title">数字输入 <span class="hint">DI</span></h2>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>设备 ID</th>
                  <th>别名</th>
                  <th>驱动 ID</th>
                  <th>地址</th>
                  <th>驱动在线</th>
                  <th>读值</th>
                </tr>
              </thead>
              <tbody id="diRows"></tbody>
            </table>
          </div>
        </div>
        <div class="card">
          <h2 class="panel-title">数字输出 <span class="hint">DO · 只读</span></h2>
          <div class="table-scroll">
            <table>
              <thead>
                <tr>
                  <th>设备 ID</th>
                  <th>别名</th>
                  <th>驱动 ID</th>
                  <th>地址</th>
                  <th>驱动在线</th>
                  <th>读值</th>
                </tr>
              </thead>
              <tbody id="doRows"></tbody>
            </table>
          </div>
        </div>
      </div>
    </div>

    <div class="msg" id="ioMsg"></div>
  </div>

  <script>
    function snapshotField(data, camel, pascal) {
      const a = data[camel];
      if (a !== undefined && a !== null) return a;
      return data[pascal];
    }

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function normDir(d) {
      return String(d || "").trim().toLowerCase();
    }

    function parseBoolVal(valStr) {
      if (valStr === null || valStr === undefined) return null;
      const t = String(valStr).trim().toLowerCase();
      if (t === "true" || t === "1" || t === "on" || t === "yes") return true;
      if (t === "false" || t === "0" || t === "off" || t === "no") return false;
      return null;
    }

    function collectPoints(devices) {
      const flat = [];
      const obj = devices && typeof devices === "object" ? devices : {};
      for (const [devId, d] of Object.entries(obj)) {
        const pts = d.gpioIoPoints ?? d.GpioIoPoints;
        if (!Array.isArray(pts) || !pts.length) continue;
        for (const p of pts) {
          const alias = p.alias ?? p.Alias ?? "-";
          const dir = normDir(p.direction ?? p.Direction ?? "-");
          const drv = p.driverId ?? p.DriverId ?? "-";
          const addr = p.address ?? p.Address ?? "-";
          const online = !!(p.driverOnline ?? p.DriverOnline);
          const val = p.value ?? p.Value;
          const valStr = val === null || val === undefined ? "—" : String(val);
          flat.push({ devId, alias, dir, drv, addr, online, valStr });
        }
      }
      return flat;
    }

    const diRows = document.getElementById("diRows");
    const doRows = document.getElementById("doRows");
    const diLedPanel = document.getElementById("diLedPanel");
    const doLedPanel = document.getElementById("doLedPanel");
    const ioFilter = document.getElementById("ioFilter");
    const lastUpdate = document.getElementById("lastUpdate");
    const ioMsg = document.getElementById("ioMsg");
    const ledView = document.getElementById("ledView");
    const tableView = document.getElementById("tableView");

    let lastDi = [];
    let lastDo = [];
    let viewMode = "led";

    function rowKey(r) {
      return r.devId + "\0" + r.alias;
    }

    function rowMatches(r, q) {
      if (!q) return true;
      const hay = [r.devId, r.alias, r.drv, r.addr, r.valStr, r.online ? "在线" : "离线", r.dir]
        .join(" ")
        .toLowerCase();
      return hay.includes(q);
    }

    function filtered(list) {
      const q = ioFilter.value.trim().toLowerCase();
      return list.filter((r) => rowMatches(r, q));
    }

    function groupByDevice(list) {
      const map = new Map();
      for (const r of list) {
        if (!map.has(r.devId)) map.set(r.devId, []);
        map.get(r.devId).push(r);
      }
      return [...map.entries()].sort((a, b) => a[0].localeCompare(b[0]));
    }

    function ledClass(r) {
      const b = parseBoolVal(r.valStr);
      let cls = "led-cell";
      if (!r.online) cls += " offline";
      if (b === true) cls += " on";
      else if (b === false) cls += " off";
      else cls += " unk";
      return cls;
    }

    function renderLed(panel, list, emptyText) {
      const groups = groupByDevice(filtered(list));
      if (!groups.length) {
        panel.innerHTML = `<div class="sub">${escapeHtml(emptyText)}</div>`;
        return;
      }
      panel.innerHTML = groups.map(([devId, pts]) => {
        const onlineN = pts.filter((p) => p.online).length;
        const cells = pts.map((r) => {
          const b = parseBoolVal(r.valStr);
          const state = b === true ? "ON" : b === false ? "OFF" : escapeHtml(r.valStr);
          return `<div class="${ledClass(r)}" title="${escapeHtml(r.drv + " " + r.addr)}">
            <span class="led-dot"></span>
            <span class="led-alias">${escapeHtml(r.alias)}</span>
            <span class="led-addr">${state} · ${escapeHtml(r.addr)}</span>
          </div>`;
        }).join("");
        return `<div class="led-group">
          <div class="led-group-title">${escapeHtml(devId)}
            <span class="hint">${pts.length} 点 · 驱动在线 ${onlineN}/${pts.length}</span>
          </div>
          <div class="led-grid">${cells}</div>
        </div>`;
      }).join("");
    }

    function statusCell(online) {
      return `<td><span class="dot ${online ? "ok" : ""}"></span>${online ? "Yes" : "No"}</td>`;
    }

    function valueCell(valStr) {
      const b = parseBoolVal(valStr);
      if (b === true) {
        return `<td class="mono"><span class="pill-on">ON</span></td>`;
      }
      if (b === false) {
        return `<td class="mono"><span class="pill-off">OFF</span></td>`;
      }
      return `<td class="mono"><span class="pill-unk">${escapeHtml(valStr)}</span></td>`;
    }

    function renderTable(tbody, list, emptyText) {
      const rows = filtered(list);
      if (!rows.length) {
        tbody.innerHTML = `<tr><td colspan="6" style="color:var(--muted)">${escapeHtml(emptyText)}</td></tr>`;
        return;
      }
      tbody.innerHTML = rows.map((r) => `<tr data-key="${escapeHtml(rowKey(r))}">
        <td class="mono">${escapeHtml(r.devId)}</td>
        <td>${escapeHtml(r.alias)}</td>
        <td class="mono">${escapeHtml(r.drv)}</td>
        <td class="mono">${escapeHtml(r.addr)}</td>
        ${statusCell(r.online)}
        ${valueCell(r.valStr)}
      </tr>`).join("");
    }

    function refreshViews() {
      renderLed(diLedPanel, lastDi, "（无 DI 映射）");
      renderLed(doLedPanel, lastDo, "（无 DO 映射）");
      renderTable(diRows, lastDi, "（无 DI 映射）");
      renderTable(doRows, lastDo, "（无 DO 映射）");
    }

    function setView(mode) {
      viewMode = mode;
      ledView.hidden = mode !== "led";
      tableView.hidden = mode !== "table";
      document.getElementById("btnViewLed").classList.toggle("active", mode === "led");
      document.getElementById("btnViewTable").classList.toggle("active", mode === "table");
    }

    async function tick() {
      try {
        const res = await fetch("/api/status", { cache: "no-store" });
        if (!res.ok) throw new Error("http " + res.status);
        const data = await res.json();
        const devicesObj = snapshotField(data, "devices", "Devices");
        const all = collectPoints(devicesObj);
        lastDi = all.filter((r) => r.dir === "in");
        lastDo = all.filter((r) => r.dir === "out");
        refreshViews();
        lastUpdate.textContent = new Date().toLocaleTimeString();
        ioMsg.textContent = "";
        ioMsg.classList.remove("err");
      } catch {
        diLedPanel.innerHTML = '<div class="sub">无法加载</div>';
        doLedPanel.innerHTML = '<div class="sub">无法加载</div>';
        diRows.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">无法加载</td></tr>';
        doRows.innerHTML = '<tr><td colspan="6" style="color:var(--muted)">无法加载</td></tr>';
        ioMsg.textContent = "无法连接 /api/status";
        ioMsg.classList.add("err");
      }
    }

    ioFilter.addEventListener("input", refreshViews);
    document.getElementById("btnViewLed").addEventListener("click", () => setView("led"));
    document.getElementById("btnViewTable").addEventListener("click", () => setView("table"));

    setView("led");
    tick();
    setInterval(tick, 1000);
  </script>
  <script src="/js/tool_nav.js"></script>
</body>
</html>
