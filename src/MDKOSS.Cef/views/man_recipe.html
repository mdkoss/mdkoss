<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>配方配置</title>
  <link rel="stylesheet" href="/css/theme-white.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="man" data-tool-page="man_recipe" data-man-kind="recipes">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">配方 <span class="pill warn">配置</span></div>
        <div class="sub" id="manMeta">Id / 名称 / 参数组</div>
      </div>
      <div class="btn-group compact-btns">
        <button type="button" class="btn" id="btnAdd">新建</button>
        <button type="button" class="btn" id="btnDup">复制</button>
        <button type="button" class="btn danger" id="btnDel">删除</button>
        <button type="button" class="btn primary" id="btnApplyPatch">应用属性</button>
      </div>
    </div>
    <p class="man-note">配方是一组参数（可来自 Vars、设置、任务、平台点位等）。应用属性写入配方库；用「应用配方」切换当前配方并更新系统内部对应参数。</p>
    <div class="man-toolbar">
      <input type="search" id="manFilter" class="filter" placeholder="查找 Id / 名称 / 变量键…" autocomplete="off" />
    </div>
    <div class="man-layout">
      <div class="card">
        <div class="label">组件列表</div>
        <div class="table-scroll">
          <table>
            <thead id="manHead"></thead>
            <tbody id="manList"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="label" id="manFormTitle">属性</div>
        <div id="manForm"></div>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script src="/js/man_editor.js"></script>
</body>
</html>
