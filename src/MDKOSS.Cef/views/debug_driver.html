<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 驱动调试</title>
  <link rel="stylesheet" href="/css/theme-debug.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="debug" data-tool-page="debug_driver">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">驱动调试 <span class="pill warn">可写</span></div>
        <div class="sub">诊断 · 端口字读写 · <a class="link-btn" href="/debug_io.html">GPIO 别名 →</a></div>
      </div>
      <a class="link-btn" href="/man_driver.html">驱动配置 →</a>
    </div>

    <div class="writable-note">
      调试模式可写端口位。生产强制请谨慎；写入会弹出确认。
      <a href="/monitor_runtime.html">运行总览</a>
    </div>

    <div class="kpi-strip" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <div class="kpi-card"><div class="label">驱动数</div><div class="value" id="kpiTotal">0</div></div>
      <div class="kpi-card"><div class="label">在线</div><div class="value" id="kpiOnline">0</div></div>
      <div class="kpi-card"><div class="label">当前</div><div class="value" id="kpiCur" style="font-size:14px">—</div></div>
      <div class="kpi-card"><div class="label">自检</div><div class="value" id="kpiDiag" style="font-size:14px">—</div></div>
    </div>

    <div class="card" style="margin-bottom:12px">
      <div class="section-head">
        <h2 class="panel-title">驱动选择 / 诊断</h2>
        <div class="btn-group compact-btns">
          <button type="button" class="btn primary btn-sm" id="btnSelfCheck">自检读口</button>
          <button type="button" class="btn btn-sm" id="btnRefresh">刷新</button>
        </div>
      </div>
      <div class="bit-toolbar">
        <div class="form-group">
          <label for="driverSel">Driver ID</label>
          <select id="driverSel"></select>
        </div>
        <div class="form-group">
          <label>类型 / 在线</label>
          <div id="driverMeta" class="bit-meta" style="margin:8px 0 0">—</div>
        </div>
      </div>
      <div class="status-matrix" id="drvMatrix" style="margin-bottom:10px"></div>
      <div class="label">诊断日志</div>
      <div class="diag-log" id="diagLog"></div>
    </div>

    <div class="io-layout">
      <div class="card">
        <h2 class="panel-title">数字输入 <span class="hint">DI · 点格写入（SIM 可测）</span></h2>
        <div class="bit-toolbar">
          <div class="form-group">
            <label for="diType">类型</label>
            <select id="diType">
              <option value="gpi" selected>gpi (4)</option>
              <option value="home">home (3)</option>
              <option value="alarm">alarm (2)</option>
              <option value="arrive">arrive (5)</option>
              <option value="limit+">limit+ (0)</option>
              <option value="limit-">limit- (1)</option>
            </select>
          </div>
        </div>
        <p class="bit-meta" id="diMeta">—</p>
        <div class="bit-grid" id="diGrid"></div>
      </div>
      <div class="card">
        <h2 class="panel-title">数字输出 <span class="hint">DO · 点格写入</span></h2>
        <div class="bit-toolbar">
          <div class="form-group">
            <label for="doType">类型</label>
            <select id="doType">
              <option value="gpo" selected>gpo (12)</option>
              <option value="enable">enable (10)</option>
              <option value="clear">clear (11)</option>
            </select>
          </div>
        </div>
        <p class="bit-meta" id="doMeta">—</p>
        <div class="bit-grid" id="doGrid"></div>
      </div>
    </div>

    <div class="msg" id="ioMsg"></div>
    <div class="footer">上次刷新：<span id="lastUpdate">-</span></div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script>
    const { esc, field, fetchJson, confirmWrite, toast, logLine, pillOnline } = MdkTool;
    const driverSel = document.getElementById("driverSel");
    const driverMeta = document.getElementById("driverMeta");
    const diType = document.getElementById("diType");
    const doType = document.getElementById("doType");
    const diGrid = document.getElementById("diGrid");
    const doGrid = document.getElementById("doGrid");
    const diMeta = document.getElementById("diMeta");
    const doMeta = document.getElementById("doMeta");
    const ioMsg = document.getElementById("ioMsg");
    const lastUpdate = document.getElementById("lastUpdate");
    const diagLog = document.getElementById("diagLog");
    const drvMatrix = document.getElementById("drvMatrix");

    let lastDrivers = {};

    function currentDriverId() {
      return driverSel.value || "";
    }

    function renderDriverTable(drivers) {
      lastDrivers = drivers && typeof drivers === "object" ? drivers : {};
      const entries = Object.entries(lastDrivers);
      const prev = currentDriverId();
      driverSel.innerHTML = entries.length
        ? entries.map(([id]) => `<option value="${esc(id)}">${esc(id)}</option>`).join("")
        : '<option value="">（无驱动）</option>';
      if (prev && lastDrivers[prev]) driverSel.value = prev;
      else if (entries.length) driverSel.selectedIndex = 0;

      document.getElementById("kpiTotal").textContent = String(entries.length);
      const onlineN = entries.filter(([, d]) => field(d, "isConnected", "IsConnected") === true).length;
      document.getElementById("kpiOnline").textContent = String(onlineN);
      document.getElementById("kpiCur").textContent = currentDriverId() || "—";

      if (!entries.length) {
        drvMatrix.innerHTML = '<div class="sub">无驱动</div>';
        driverMeta.textContent = "—";
        return;
      }
      drvMatrix.innerHTML = entries.map(([id, d]) => {
        const type = field(d, "type", "Type") ?? field(d, "name", "Name") ?? "—";
        const online = field(d, "isConnected", "IsConnected") === true;
        const tone = online ? "ok" : "warn";
        const sel = id === currentDriverId() ? " style=\"outline:2px solid var(--mode-band)\"" : "";
        return `<button type="button" class="status-cell ${tone}" data-id="${esc(id)}"${sel} style="cursor:pointer;text-align:left;font:inherit">
          <span class="sc-id">${esc(id)}</span>
          <span class="sc-meta">${esc(type)}</span>
          <span class="sc-state">${online ? "在线" : "离线"}</span>
        </button>`;
      }).join("");
      drvMatrix.querySelectorAll("button[data-id]").forEach((btn) => {
        btn.addEventListener("click", () => {
          driverSel.value = btn.getAttribute("data-id");
          tickPorts();
          renderDriverTable(lastDrivers);
        });
      });
      const cur = lastDrivers[currentDriverId()] || {};
      const type = field(cur, "type", "Type") ?? field(cur, "name", "Name") ?? "—";
      const online = field(cur, "isConnected", "IsConnected");
      driverMeta.innerHTML = `${esc(type)} · ${pillOnline(online === true ? true : online === false ? false : null)}`;
    }

    function renderGrid(el, metaEl, data, dir) {
      if (!data || !data.success) {
        el.innerHTML = "";
        metaEl.textContent = data && data.error ? data.error : "无法读取";
        return;
      }
      metaEl.textContent = `${data.address} · word=0x${Number(data.word).toString(16).toUpperCase()} · ioBitBase=${data.ioBitBase}`;
      el.innerHTML = (data.bits || []).map((b) => {
        const on = b.value ? " on" : "";
        return `<button type="button" class="bit-cell${on}" data-dir="${esc(dir)}" data-bit="${b.addressBit}" title="${esc(b.address)}">
          <span class="bit-n">${b.addressBit}</span>
          <span class="bit-addr">${esc(b.address)}</span>
        </button>`;
      }).join("");
      el.querySelectorAll("button.bit-cell").forEach((btn) => btn.addEventListener("click", onBitClick));
    }

    async function fetchPort(dir, type) {
      const id = currentDriverId();
      if (!id) return { success: false, error: "no_driver" };
      const q = new URLSearchParams({ driverId: id, dir, type });
      const res = await fetch("/api/io/driver?" + q.toString(), { cache: "no-store" });
      return await res.json().catch(() => ({ success: false, error: "http " + res.status }));
    }

    async function onBitClick(ev) {
      const btn = ev.currentTarget;
      const dir = btn.getAttribute("data-dir");
      const bit = Number(btn.getAttribute("data-bit"));
      const type = dir === "di" ? diType.value : doType.value;
      const next = !btn.classList.contains("on");
      if (!confirmWrite("确认写入驱动端口位？", `驱动: ${currentDriverId()}\n方向: ${dir}\n类型: ${type}\n位: ${bit}\n值: ${next}`)) return;
      ioMsg.textContent = "正在写入…";
      ioMsg.classList.remove("err");
      try {
        const res = await fetch("/api/io/driver", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            driverId: currentDriverId(),
            dir,
            type,
            bit,
            value: next,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (!res.ok || !data.success) throw new Error(data.error || "http " + res.status);
        ioMsg.textContent = "写入 " + (data.address || "") + " = " + next;
        logLine(diagLog, `WRITE ${dir} ${type} bit=${bit} → ${next}`, true);
        await tickPorts();
      } catch (e) {
        ioMsg.textContent = "写入失败: " + (e && e.message ? e.message : String(e));
        ioMsg.classList.add("err");
        logLine(diagLog, "WRITE FAIL " + (e.message || e), false);
      }
    }

    async function tickPorts() {
      const id = currentDriverId();
      document.getElementById("kpiCur").textContent = id || "—";
      if (!id) {
        diGrid.innerHTML = "";
        doGrid.innerHTML = "";
        diMeta.textContent = "选择驱动";
        doMeta.textContent = "选择驱动";
        return;
      }
      const [di, dout] = await Promise.all([
        fetchPort("di", diType.value),
        fetchPort("do", doType.value),
      ]);
      renderGrid(diGrid, diMeta, di, "di");
      renderGrid(doGrid, doMeta, dout, "do");
    }

    async function selfCheck() {
      const id = currentDriverId();
      if (!id) {
        toast("请先选择驱动", false);
        return;
      }
      document.getElementById("kpiDiag").textContent = "检测中";
      logLine(diagLog, `SELFCHECK start ${id}`, true);
      try {
        const [di, dout] = await Promise.all([
          fetchPort("di", diType.value),
          fetchPort("do", doType.value),
        ]);
        const diOk = !!(di && di.success);
        const doOk = !!(dout && dout.success);
        const online = field(lastDrivers[id] || {}, "isConnected", "IsConnected") === true;
        const ok = diOk && doOk;
        document.getElementById("kpiDiag").textContent = ok ? "通过" : "失败";
        logLine(diagLog, `online=${online} DI=${diOk ? "OK" : di.error || "FAIL"} DO=${doOk ? "OK" : dout.error || "FAIL"}`, ok);
        toast(ok ? "自检通过" : "自检失败", ok);
        renderGrid(diGrid, diMeta, di, "di");
        renderGrid(doGrid, doMeta, dout, "do");
      } catch (e) {
        document.getElementById("kpiDiag").textContent = "失败";
        logLine(diagLog, "SELFCHECK " + (e.message || e), false);
        toast(e.message || "自检失败", false);
      }
    }

    async function tick() {
      try {
        const data = await fetchJson("/api/status");
        const drivers = field(data, "drivers", "Drivers") || {};
        renderDriverTable(drivers);
        await tickPorts();
        lastUpdate.textContent = new Date().toLocaleTimeString();
      } catch (e) {
        ioMsg.textContent = "无法连接 /api/status";
        ioMsg.classList.add("err");
        logLine(diagLog, e.message || "status fail", false);
      }
    }

    document.getElementById("btnSelfCheck").onclick = selfCheck;
    document.getElementById("btnRefresh").onclick = () => tick();
    driverSel.addEventListener("change", () => { tickPorts(); renderDriverTable(lastDrivers); });
    diType.addEventListener("change", () => tickPorts());
    doType.addEventListener("change", () => tickPorts());
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
