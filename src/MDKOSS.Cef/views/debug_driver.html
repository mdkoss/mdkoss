<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 驱动调试</title>
  <link rel="stylesheet" href="/css/theme-gray.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="debug" data-tool-page="debug_driver">
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">驱动状态 <span class="pill warn">只读联调</span></div>
        <div class="sub">运行时驱动在线状态 · 连接/断开请用 Config.Wpf 或重启后配置</div>
      </div>
      <a class="link-btn" href="/man_driver.html">驱动配置 →</a>
    </div>
    <div class="card">
      <div class="label">驱动列表（/api/status）</div>
      <div class="table-scroll">
        <table>
          <thead><tr><th>Driver ID</th><th>类型</th><th>在线</th></tr></thead>
          <tbody id="rows"><tr><td colspan="3" style="color:var(--muted)">加载中…</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script>
    const { esc, field, fetchJson } = MdkTool;
    async function tick() {
      try {
        const data = await fetchJson("/api/status");
        const drivers = field(data, "drivers", "Drivers") || {};
        const entries = Object.entries(drivers);
        const body = document.getElementById("rows");
        if (!entries.length) {
          body.innerHTML = '<tr><td colspan="3" style="color:var(--muted)">无驱动</td></tr>';
          return;
        }
        body.innerHTML = entries.map(([id, d]) => {
          const type = field(d, "type", "Type") ?? field(d, "name", "Name") ?? "—";
          const online = field(d, "isConnected", "IsConnected");
          return `<tr><td>${esc(id)}</td><td>${esc(type)}</td><td>${online === true ? "是" : online === false ? "否" : esc(online)}</td></tr>`;
        }).join("");
      } catch (e) {
        document.getElementById("rows").innerHTML =
          `<tr><td colspan="3" style="color:var(--danger)">${esc(e.message)}</td></tr>`;
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
