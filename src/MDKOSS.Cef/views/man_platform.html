<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>平台配置</title>
  <link rel="stylesheet" href="/css/theme-gray.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="man" data-tool-page="man_platform" data-man-kind="platforms">
  <div id="toast" class="toast" role="status"></div>
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">平台配置 <span class="pill warn">配置</span></div>
        <div class="sub" id="manMeta">xy / xyz / xyzu · axis.X 绑定已有轴 Id</div>
      </div>
      <div class="btn-group">
        <button type="button" class="btn" id="btnAdd">新建</button>
        <button type="button" class="btn" id="btnDup">复制</button>
        <button type="button" class="btn danger" id="btnDel">删除</button>
        <button type="button" class="btn primary" id="btnApplyPatch">应用属性</button>
        <button type="button" class="btn" id="btnSaveDisk">保存到磁盘</button>
      </div>
    </div>
    <p class="man-note">与 Config.Wpf 相同：Parameters 中 axis.X / axis.Y … 填写已有轴组件 Id；补全模板按 Type 填充键。</p>
    <div class="man-toolbar">
      <input type="search" id="manFilter" class="filter" placeholder="查找 Name / Type / 轴绑定…" autocomplete="off" />
      <div id="manQuickAdd" class="man-quick"></div>
    </div>
    <div class="man-layout">
      <div class="card">
        <div class="label">组件列表</div>
        <div class="table-scroll">
          <table>
            <thead id="manHead"></thead>
            <tbody id="manList"></tbody>
          </table>
        </div>
      </div>
      <div class="card">
        <div class="label" id="manFormTitle">属性</div>
        <div id="manForm"></div>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script src="/js/man_editor.js"></script>
</body>
</html>
