<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>设备组件</title>
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { margin: 0; background: var(--bg); min-height: 100%; }
    .popup-page { padding: 12px 14px; }
    .popup-page table { width: 100%; border-collapse: collapse; font-size: 12px; }
    .popup-page th, .popup-page td { padding: 6px 8px; border-bottom: 1px solid var(--line); text-align: left; }
    .popup-page th { color: var(--muted); font-weight: 600; }
    .popup-page a { color: var(--accent); text-decoration: none; margin-right: 8px; }
    .popup-page .empty { color: var(--muted); padding: 16px; text-align: center; }
    body.embedded .standalone-title { display: none; }
  </style>
</head>
<body>
  <div class="popup-page">
    <div class="standalone-title" style="font-weight:700;margin-bottom:10px">设备组件</div>
    <div id="body"><div class="empty">加载中…</div></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") document.body.classList.add("embedded");
    const PLATFORM = new Set(["platform","xy","xyz","xyzu","xyzuv","xyzuvw"]);
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");}
    async function tick(){
      try{
        const res = await fetch("/api/status",{cache:"no-store"});
        if(!res.ok) throw new Error("http");
        const data = await res.json();
        const devices = data.devices || data.Devices || {};
        const entries = Object.entries(devices);
        const el = document.getElementById("body");
        if(!entries.length){ el.innerHTML = '<div class="empty">无设备</div>'; return; }
        el.innerHTML = `<table><thead><tr><th>ID</th><th>名称</th><th>类型</th><th>状态</th><th></th></tr></thead><tbody>${
          entries.map(([id,d])=>{
            const name=d.name??d.Name??id;
            const type=String(d.type??d.Type??"—");
            const st=String(d.state??d.State??"—");
            const t=type.toLowerCase();
            let links="";
            if(PLATFORM.has(t)){
              links=`<a href="/monitor_platform.html?deviceId=${encodeURIComponent(id)}" target="_blank">监控</a>`
                +`<a href="/debug_platform.html?deviceId=${encodeURIComponent(id)}" target="_blank">示教</a>`;
            } else if(t==="serialdev"){
              links=`<a href="/debug_serial.html?deviceId=${encodeURIComponent(id)}" target="_blank">串口</a>`;
            } else if(t==="gpio"||t==="vio"){
              links=`<a href="/monitor_io.html" target="_blank">IO</a>`;
            } else if(t==="axis"){
              links=`<a href="/monitor_axis.html?deviceId=${encodeURIComponent(id)}" target="_blank">监控</a>`;
            } else if(t==="cameradev"||t==="camera"){
              links=`<a href="/monitor_camera.html?deviceId=${encodeURIComponent(id)}" target="_blank">监控</a>`;
            } else {
              links=`<a href="/monitor_runtime.html" target="_blank">总览</a>`;
            }
            return `<tr><td>${esc(id)}</td><td>${esc(name)}</td><td>${esc(type)}</td><td>${esc(st)}</td><td>${links}</td></tr>`;
          }).join("")
        }</tbody></table>`;
      }catch{
        document.getElementById("body").innerHTML='<div class="empty">无法连接 /api/status</div>';
      }
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
