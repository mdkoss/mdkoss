<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报警</title>
  <link rel="stylesheet" href="/css/theme-navy.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { margin: 0; background: var(--panel); }
    .popup-page a { margin-right: 8px; }
  </style>
</head>
<body>
  <div class="popup-page">
    <div class="standalone-title" style="font-weight:700;margin-bottom:10px">报警 / 异常</div>
    <div class="actions">
      <button type="button" id="btnTest">测试触发</button>
      <button type="button" id="btnReset">复位</button>
    </div>
    <div id="body"><div class="empty">加载中…</div></div>
    <div style="margin-top:12px;display:flex;gap:12px;flex-wrap:wrap">
      <a href="/monitor_alarm.html" target="_blank" style="color:var(--accent)">报警监控 →</a>
      <a href="/debug_alarm.html" target="_blank" style="color:var(--accent)">报警调试 →</a>
      <a href="/man_alarm.html" target="_blank" style="color:var(--accent)">报警定义 →</a>
    </div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") document.body.classList.add("embedded");
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    async function post(path){
      await fetch(path,{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});
      await tick();
    }
    async function tick(){
      try{
        const data = await (await fetch("/api/alarms",{cache:"no-store"})).json();
        const items = (data.items || []).filter(a => a.active || a.Active);
        const el=document.getElementById("body");
        if (!items.length) { el.innerHTML='<div class="empty">无报警</div>'; return; }
        el.innerHTML = items.map(a=>{
          const level=String(a.level??a.Level??"error").toLowerCase();
          const name=a.name??a.Name??a.id??a.Id??"";
          const msg=a.message??a.Message??"";
          const icon=level==="error"?"🔴":(level==="warn"?"🟡":"ℹ️");
          return `<div class="alarm"><span>${icon}</span><span>${esc(name)}${msg?" — "+esc(msg):""}</span></div>`;
        }).join("");
      }catch{
        document.getElementById("body").innerHTML='<div class="empty">无法连接 /api/alarms</div>';
      }
    }
    document.getElementById("btnTest").onclick = () => post("/api/alarms/test");
    document.getElementById("btnReset").onclick = () => post("/api/alarms/reset");
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
