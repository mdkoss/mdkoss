<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>报警</title>
  <link rel="stylesheet" href="/css/theme-navy.css" />
  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { margin: 0; background: var(--bg); }
    .popup-page { padding: 12px 14px; }
    .alarm { display:flex; gap:10px; padding:8px; border-bottom:1px solid var(--line); font-size:12px; }
    .empty { color: var(--muted); padding: 16px; text-align: center; }
    body.embedded .standalone-title { display: none; }
  </style>
</head>
<body>
  <div class="popup-page">
    <div class="standalone-title" style="font-weight:700;margin-bottom:10px">报警 / 异常</div>
    <div id="body"><div class="empty">加载中…</div></div>
    <div style="margin-top:12px;font-size:12px"><a href="/monitor_runtime.html" target="_blank" style="color:var(--accent)">打开运行监控 →</a></div>
  </div>
  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") document.body.classList.add("embedded");
    function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
    function vs(vars,k,fb){const x=vars[k]; return (x==null||x==="")?fb:String(x);}
    function vn(vars,k,fb){const n=Number(vars[k]); return Number.isFinite(n)?n:fb;}
    async function tick(){
      try{
        const data = await (await fetch("/api/status",{cache:"no-store"})).json();
        const vars = data.vars || data.Vars || {};
        const devices = data.devices || data.Devices || {};
        const alarms = [];
        const op = vs(vars,"task.operation.state","");
        if (op==="fault"||op==="stopped") alarms.push({bad:op==="fault", text:`操作任务: ${op} — ${vs(vars,"task.operation.message","")}`});
        const df=vn(vars,"task.cycle.dev.fault",0); if(df>0) alarms.push({bad:true,text:`设备故障 ${df} 台`});
        const tf=vn(vars,"task.cycle.task.fault",0); if(tf>0) alarms.push({bad:true,text:`任务故障 ${tf} 个`});
        for (const [id,d] of Object.entries(devices)) {
          const st=String(d.state??d.State??"").toLowerCase();
          if (st==="fault"||st==="error") alarms.push({bad:true,text:`设备 ${id}: ${st}`});
        }
        const el=document.getElementById("body");
        if (!alarms.length) { el.innerHTML='<div class="empty">无报警</div>'; return; }
        el.innerHTML = alarms.map(a=>`<div class="alarm"><span>${a.bad?"🔴":"🟡"}</span><span>${esc(a.text)}</span></div>`).join("");
      }catch{
        document.getElementById("body").innerHTML='<div class="empty">无法连接</div>';
      }
    }
    tick(); setInterval(tick, 1000);
  </script>
</body>
</html>
