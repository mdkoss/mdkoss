  <link rel="stylesheet" href="/css/main.css" />
  <style>
    body { margin: 0; background: var(--bg); }
    .popup-page { padding: 12px 14px; font-size: 13px; }
    .row { display:flex; justify-content:space-between; gap:12px; padding:6px 0; border-bottom:1px solid var(--line); }
    .row span:first-child { color: var(--muted); }
    .sec { margin-top: 14px; font-weight: 700; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .04em; }
    .links a { display:inline-block; margin: 4px 10px 4px 0; color: var(--accent); text-decoration: none; font-size: 12px; }
    body.embedded .standalone-title { display: none; }
  </style>
</head>
<body>
  <div class="popup-page">
    <div class="standalone-title" style="font-weight:700;margin-bottom:10px">关于 MDKOSS</div>
    <div class="row"><span>项目</span><span id="aboutProject">—</span></div>
    <div class="row"><span>运行时</span><span id="aboutRuntime">—</span></div>

  <script>
    if (new URLSearchParams(location.search).get("embedded") === "1") document.body.classList.add("embedded");
    async function tick(){
      try{
        const data = await (await fetch("/api/status",{cache:"no-store"})).json();
        document.getElementById("aboutProject").textContent = data.projectName || data.ProjectName || "—";
        document.getElementById("aboutRuntime").textContent = (data.isRunning || data.IsRunning) ? "RUNNING" : "STOPPED";
      }catch{
        document.getElementById("aboutRuntime").textContent = "离线";
      }
    }
    tick(); setInterval(tick, 2000);
  </script>
</body>
