<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 轴状态监控</title>
  <link rel="stylesheet" href="/css/theme-gray.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="monitor" data-tool-page="monitor_axis">
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">轴状态监控 <span class="pill warn">只读</span></div>
        <div class="sub" id="hdrSubtitle">选择轴设备查看状态</div>
      </div>
      <a class="link-btn" id="lnkDebug" href="/debug_axis.html">轴调试 →</a>
    </div>
    <div class="form-row" style="margin-bottom:12px">
      <div class="form-group" style="flex:2">
        <label>轴设备</label>
        <select id="selAxis"><option value="">— 选择 —</option></select>
      </div>
    </div>
    <div class="grid">
      <div class="card span-4"><div class="label">状态</div><div class="value" id="vState">—</div></div>
      <div class="card span-4"><div class="label">驱动</div><div class="value" id="vDriver">—</div></div>
      <div class="card span-4"><div class="label">在线</div><div class="value" id="vOnline">—</div></div>
      <div class="card span-12">
        <div class="label">相关变量（device.*）</div>
        <table>
          <thead><tr><th>键</th><th>值</th></tr></thead>
          <tbody id="varRows"><tr><td colspan="2" style="color:var(--muted)">请选择轴</td></tr></tbody>
        </table>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script>
    const { esc, field, qs, fetchJson } = MdkTool;
    const sel = document.getElementById("selAxis");
    let preferred = qs("deviceId", "");

    function updateDebugLink() {
      const id = sel.value;
      document.getElementById("lnkDebug").href = id
        ? `/debug_axis.html?deviceId=${encodeURIComponent(id)}`
        : "/debug_axis.html";
    }

    function fillSelect(devices) {
      const cur = sel.value || preferred;
      const opts = Object.entries(devices || {})
        .filter(([, d]) => String(field(d, "type", "Type") || "").toLowerCase() === "axis")
        .map(([id, d]) => {
          const name = field(d, "name", "Name") || id;
          return `<option value="${esc(id)}">${esc(name)} (${esc(id)})</option>`;
        });
      sel.innerHTML = '<option value="">— 选择 —</option>' + opts.join("");
      if (cur && [...sel.options].some((o) => o.value === cur)) sel.value = cur;
      else if (sel.options.length > 1) sel.selectedIndex = 1;
      preferred = "";
      updateDebugLink();
    }

    function render(id, devices, vars) {
      updateDebugLink();
      const d = devices?.[id];
      if (!d) {
        document.getElementById("hdrSubtitle").textContent = "未找到设备";
        return;
      }
      const name = field(d, "name", "Name") || id;
      document.getElementById("hdrSubtitle").textContent = `${name} · ${id}`;
      document.getElementById("vState").textContent = String(field(d, "state", "State") || "—");
      document.getElementById("vDriver").textContent = String(field(d, "driverType", "DriverType") || "—");
      document.getElementById("vOnline").textContent =
        field(d, "driverConnected", "DriverConnected") === true ? "是" :
        field(d, "driverConnected", "DriverConnected") === false ? "否" : "—";

      const prefix = `device.${name}.${id}.`;
      const keys = Object.keys(vars || {}).filter((k) => k.toLowerCase().startsWith(prefix.toLowerCase())
        || (k.toLowerCase().includes(`.${id.toLowerCase()}.`)))
        .sort((a, b) => a.localeCompare(b));
      const body = document.getElementById("varRows");
      if (!keys.length) {
        body.innerHTML = '<tr><td colspan="2" style="color:var(--muted)">无匹配变量</td></tr>';
        return;
      }
      body.innerHTML = keys.map((k) => {
        let v = vars[k];
        if (typeof v === "object") try { v = JSON.stringify(v); } catch { v = String(v); }
        return `<tr><td>${esc(k)}</td><td style="font-family:monospace;font-size:12px">${esc(v)}</td></tr>`;
      }).join("");
    }

    sel.addEventListener("change", () => tick());

    async function tick() {
      try {
        const data = await fetchJson("/api/status");
        const devices = field(data, "devices", "Devices") || {};
        const vars = field(data, "vars", "Vars") || {};
        fillSelect(devices);
        if (sel.value) render(sel.value, devices, vars);
      } catch {
        document.getElementById("hdrSubtitle").textContent = "无法连接 /api/status";
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
