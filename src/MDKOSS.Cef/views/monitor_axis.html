<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>MDKOSS 轴状态监控</title>
  <link rel="stylesheet" href="/css/theme-monitor.css" />
  <link rel="stylesheet" href="/css/debug.css" />
</head>
<body data-tool-group="monitor" data-tool-page="monitor_axis">
  <div class="wrap">
    <div class="header">
      <div>
        <div class="title">轴状态监控 <span class="pill warn">只读</span></div>
        <div class="sub" id="hdrSubtitle">全轴一览 · 选中查看 Faceplate</div>
      </div>
      <a class="link-btn" id="lnkDebug" href="/debug_axis.html">轴调试 →</a>
    </div>

    <div class="readonly-note">
      默认显示全部轴。点动 / 使能 / 定位请进入
      <a id="lnkDebugNote" href="/debug_axis.html">轴调试</a>。
    </div>

    <div class="kpi-strip" style="grid-template-columns:repeat(4,minmax(0,1fr))">
      <div class="kpi-card"><div class="label">轴数量</div><div class="value" id="kpiTotal">0</div></div>
      <div class="kpi-card"><div class="label">在线</div><div class="value" id="kpiOnline">0</div></div>
      <div class="kpi-card"><div class="label">使能</div><div class="value" id="kpiEnabled">0</div></div>
      <div class="kpi-card"><div class="label">报警位</div><div class="value" id="kpiAlarm">0</div></div>
    </div>

    <div class="grid runtime-dash">
      <div class="card span-12">
        <div class="section-head">
          <h2 class="panel-title">轴一览</h2>
          <input type="search" class="filter" id="flt" placeholder="筛选 ID / 名称…" style="margin:0;max-width:240px" />
        </div>
        <div class="table-scroll" style="max-height:280px">
          <table class="overview-table">
            <thead>
              <tr>
                <th>名称</th><th>ID</th><th>在线</th><th>使能</th>
                <th>指令位</th><th>编码位</th><th>速度</th><th>状态位</th>
              </tr>
            </thead>
            <tbody id="axisRows"><tr><td colspan="8" style="color:var(--muted)">加载中…</td></tr></tbody>
          </table>
        </div>
      </div>

      <div class="card span-12">
        <div class="section-head">
          <h2 class="panel-title">Faceplate <span class="hint" id="fpTitle">未选择</span></h2>
          <a class="link-btn" id="lnkDebugFp" href="/debug_axis.html">调试此轴 →</a>
        </div>
        <div class="faceplate-grid" id="fpGrid">
          <div class="fp-kpi"><div class="label">状态</div><div class="value" id="vState" style="font-size:16px">—</div></div>
          <div class="fp-kpi"><div class="label">驱动</div><div class="value" id="vDriver" style="font-size:16px">—</div></div>
          <div class="fp-kpi"><div class="label">在线</div><div class="value" id="vOnline" style="font-size:16px">—</div></div>
          <div class="fp-kpi"><div class="label">使能</div><div class="value" id="vEnabled">—</div></div>
          <div class="fp-kpi"><div class="label">指令位置</div><div class="value" id="vPrf">—</div></div>
          <div class="fp-kpi"><div class="label">编码器</div><div class="value" id="vEnc">—</div></div>
          <div class="fp-kpi"><div class="label">速度</div><div class="value" id="vVel">—</div></div>
          <div class="fp-kpi"><div class="label">Status Word</div><div class="value" id="vRaw" style="font-size:16px">—</div></div>
        </div>
        <div style="margin-top:10px">
          <div class="label">轴状态位</div>
          <div class="flag-row" id="flagRow"></div>
        </div>
      </div>
    </div>
  </div>
  <script src="/js/tool_common.js"></script>
  <script src="/js/tool_nav.js"></script>
  <script>
    const { esc, field, qs, fetchJson, isAxisType, axisStatusOf, renderAxisFlags, flagOn, fmtAxisNum, pillOnline } = MdkTool;
    let preferred = qs("deviceId", "");
    let selected = preferred || "";
    let lastDevices = {};

    function setLinks(id) {
      const href = id ? `/debug_axis.html?deviceId=${encodeURIComponent(id)}` : "/debug_axis.html";
      document.getElementById("lnkDebug").href = href;
      document.getElementById("lnkDebugNote").href = href;
      document.getElementById("lnkDebugFp").href = href;
    }

    function collectAxes(devices) {
      return Object.entries(devices || {})
        .filter(([, d]) => isAxisType(field(d, "type", "Type")))
        .map(([id, d]) => {
          const st = axisStatusOf(d);
          const online = field(d, "driverConnected", "DriverConnected") === true;
          const enabled = st ? flagOn(st, "servoOn") : false;
          const alarm = st ? flagOn(st, "alarm") : false;
          return {
            id,
            name: field(d, "name", "Name") || id,
            online,
            enabled,
            alarm,
            prf: st ? fmtAxisNum(st.prfPosition ?? st.PrfPosition) : "—",
            enc: st ? fmtAxisNum(st.encPosition ?? st.EncPosition) : "—",
            vel: st ? fmtAxisNum(st.velocity ?? st.Velocity) : "—",
            flags: renderAxisFlags(st),
            d,
            st,
          };
        })
        .sort((a, b) => a.name.localeCompare(b.name, "zh"));
    }

    function renderOverview(list) {
      const q = document.getElementById("flt").value.trim().toLowerCase();
      const filtered = list.filter((a) => !q || (a.id + " " + a.name).toLowerCase().includes(q));
      document.getElementById("kpiTotal").textContent = String(list.length);
      document.getElementById("kpiOnline").textContent = String(list.filter((a) => a.online).length);
      document.getElementById("kpiEnabled").textContent = String(list.filter((a) => a.enabled).length);
      document.getElementById("kpiAlarm").textContent = String(list.filter((a) => a.alarm).length);

      const body = document.getElementById("axisRows");
      if (!filtered.length) {
        body.innerHTML = '<tr><td colspan="8" style="color:var(--muted)">无轴设备</td></tr>';
        return;
      }
      if (!selected && filtered.length) selected = filtered[0].id;
      body.innerHTML = filtered.map((a) => `<tr data-id="${esc(a.id)}" class="${a.id === selected ? "selected" : ""}">
        <td>${esc(a.name)}</td>
        <td class="mono">${esc(a.id)}</td>
        <td>${pillOnline(a.online)}</td>
        <td>${a.enabled ? '<span class="pill ok">ON</span>' : '<span class="pill-off">OFF</span>'}</td>
        <td class="num">${esc(a.prf)}</td>
        <td class="num">${esc(a.enc)}</td>
        <td class="num">${esc(a.vel)}</td>
        <td><div class="flag-row">${a.flags}</div></td>
      </tr>`).join("");
      body.querySelectorAll("tr[data-id]").forEach((tr) => {
        tr.addEventListener("click", () => {
          selected = tr.getAttribute("data-id");
          renderFaceplate();
          renderOverview(collectAxes(lastDevices));
        });
      });
    }

    function renderFaceplate() {
      setLinks(selected);
      const d = lastDevices[selected];
      if (!d) {
        document.getElementById("fpTitle").textContent = "未选择";
        document.getElementById("flagRow").innerHTML = renderAxisFlags(null);
        return;
      }
      const name = field(d, "name", "Name") || selected;
      document.getElementById("fpTitle").textContent = `${name} · ${selected}`;
      document.getElementById("hdrSubtitle").textContent = `已选 ${name}`;
      const st = axisStatusOf(d);
      document.getElementById("vState").textContent = String(field(d, "state", "State") || "—");
      document.getElementById("vDriver").textContent = String(field(d, "driverType", "DriverType") || "—");
      const online = field(d, "driverConnected", "DriverConnected");
      document.getElementById("vOnline").innerHTML = pillOnline(online === true ? true : online === false ? false : null);
      document.getElementById("vEnabled").textContent = st ? (flagOn(st, "servoOn") ? "ON" : "OFF") : "—";
      document.getElementById("vPrf").textContent = st ? fmtAxisNum(st.prfPosition ?? st.PrfPosition) : "—";
      document.getElementById("vEnc").textContent = st ? fmtAxisNum(st.encPosition ?? st.EncPosition) : "—";
      document.getElementById("vVel").textContent = st ? fmtAxisNum(st.velocity ?? st.Velocity) : "—";
      const raw = st ? (st.raw ?? st.Raw) : null;
      document.getElementById("vRaw").textContent = raw == null ? "—" : "0x" + Number(raw).toString(16).toUpperCase().padStart(8, "0");
      document.getElementById("flagRow").innerHTML = renderAxisFlags(st);
    }

    document.getElementById("flt").addEventListener("input", () => renderOverview(collectAxes(lastDevices)));

    async function tick() {
      try {
        const data = await fetchJson("/api/status");
        lastDevices = field(data, "devices", "Devices") || {};
        const list = collectAxes(lastDevices);
        if (preferred && list.some((a) => a.id === preferred)) {
          selected = preferred;
          preferred = "";
        }
        renderOverview(list);
        renderFaceplate();
      } catch {
        document.getElementById("hdrSubtitle").textContent = "无法连接 /api/status";
      }
    }
    tick();
    setInterval(tick, 1000);
  </script>
</body>
</html>
