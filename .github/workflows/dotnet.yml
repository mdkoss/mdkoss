name: .NET

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore MDKOSS.sln
      - name: Build
        run: dotnet build MDKOSS.sln -c Release --no-restore
      - name: Test
        run: dotnet test MDKOSS.sln -c Release --no-build --verbosity normal
