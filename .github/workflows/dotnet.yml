name: .NET

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore MDKOSS.sln
      - name: Build
        run: dotnet build MDKOSS.sln -c Release --no-restore
      - name: Test
        run: dotnet test MDKOSS.sln -c Release --no-build --verbosity normal
      # Publish runnable hosts (not the Cef library alone). Tag must match MdkProduct.ReleaseTag (v*).
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          dotnet publish src/MDKOSS.Cef.Sample/MDKOSS.Cef.Sample.csproj -c Release -o publish/cef-sample
          dotnet publish src/MDKOSS.Sample/MDKOSS.Sample.csproj -c Release -o publish/sample
          dotnet publish src/MDKOSS.Sample.DieBonder/MDKOSS.Sample.DieBonder.csproj -c Release -o publish/diebonder
          dotnet publish src/MDKOSS.Sample.Dispenser/MDKOSS.Sample.Dispenser.csproj -c Release -o publish/dispenser
          dotnet publish src/MDKOSS.Config.Wpf/MDKOSS.Config.Wpf.csproj -c Release -o publish/config
      - name: Zip publish output
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar -a -c -f "MDKOSS-${{ github.ref_name }}-win-x64.zip" publish
      - name: Upload workflow artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: MDKOSS-${{ github.ref_name }}
          path: publish/**
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MDKOSS ${{ github.ref_name }}
          files: MDKOSS-${{ github.ref_name }}-win-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
