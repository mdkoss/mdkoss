name: .NET

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Restore
        run: dotnet restore MDKOSS.sln
      - name: Build
        run: dotnet build MDKOSS.sln -c Release --no-restore
      - name: Test
        run: dotnet test MDKOSS.sln -c Release --no-build --verbosity normal
      - name: Publish
        if: startsWith(github.ref, 'refs/tags/v')
        run: dotnet publish src/MDKOSS.csproj -c Release -o publish
      - name: Upload release artifact
        if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: MDKOSS-${{ github.ref_name }}
          path: publish/**
